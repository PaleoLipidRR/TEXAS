name: texas-env
channels:
  - conda-forge
channel_priority: strict

dependencies:
  # --- Core & Environment ---
  - python=3.10
  - pip
  - jupyterlab
  - ipywidgets
  - tqdm
  - ipykernel

  # --- Core Scientific Stack ---
  - numpy
  - pandas
  - openpyxl
  - scipy
  - scikit-learn
  - statsmodels
  - seaborn
  - gsw
  
  # --- Core Data Handling ---
  - xarray
  - dask
  - distributed
  - zarr
  - netcdf4
  - h5netcdf
  - cftime

  # --- Plotting (Stable Pinned Versions) ---
  # NOTE: Multiple pins here increase solver complexity.
  - matplotlib<3.5
  - matplotlib-inline<0.2.0
  - setuptools<81
  - cmocean
  - plotly
  - pygmt
  
  ### Google Map/Google Earth
  - geetools
  - simplekml
  - salem
  
  # --- Geo Stack (Complex Dependencies) ---
  # NOTE: shapely<2 is a major constraint.
  - geopandas
  - shapely
  - pyproj
  - cartopy
  - pyogrio
  - mapclassify
  - rtree
  - geopy
  - pyshp=2.3.*
  - pygplates

  # --- xESMF Stack (Complex Dependencies) ---
  - xesmf
  - esmpy
  - esmf
  - hdf5
  - libnetcdf

  # --- Stan & Other Tools ---
  - cmdstan=2.36.0
  - cmdstanpy>=1.0
  - stanio
  - typing-extensions
  - anywidget
  - ipylab
  - duckdb
  - pyarrow
  - sqlalchemy
  - pydantic
  - importlib-metadata<5.0
  - biopython

  # --- Pip-only packages (conda-lock skips these if listed under conda) ---
  - pip:
    - proplot==0.9.7
    - pykrige
    - regionmask>=0.9
    - odrpack
    - baysparpy
    - baysplinepy
    - texas-psm
