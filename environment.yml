name: texas-env
channels:
  - conda-forge
channel_priority: strict

dependencies:
  # --- Core & Environment ---
  - python=3.10
  - pip
  - jupyterlab
  - ipywidgets
  - tqdm
  - ipykernel

  # --- Core Scientific Stack ---
  - numpy
  - pandas
  - openpyxl
  - scipy
  - scikit-learn
  - statsmodels
  - seaborn
  - gsw
  
  # --- Core Data Handling ---
  - xarray
  - dask
  - distributed
  - zarr
  - netcdf4
  - h5netcdf
  - cftime

  # --- Plotting (Stable Pinned Versions) ---
  # NOTE: Multiple pins here increase solver complexity.
  - matplotlib<3.5
  - matplotlib-inline<0.2.0
  - setuptools<81
  - cmocean
  - plotly

  # --- Geo Stack (Complex Dependencies) ---
  # NOTE: shapely<2 is a major constraint.
  - geopandas
  - shapely
  - pyproj
  - cartopy
  - pyogrio
  - mapclassify
  - rtree
  - geopy
  - pyshp=2.3.*
  - pygplates

  # --- xESMF Stack (Complex Dependencies) ---
  - xesmf
  - esmpy
  - esmf
  - hdf5
  - libnetcdf

  # --- Stan & Other Tools ---
  - cmdstan=2.36.0  # [unix]
  - cmdstanpy>=1.0
  - stanio
  - typing-extensions
  - pyarrow
  - importlib-metadata<5.0

  # --- Pip-only packages (conda-lock skips these if listed under conda) ---
  - pip:
    - ultraplot
    - pykrige
    - regionmask>=0.9
    - odrpack
    - baysparpy>=0.0.2      # SI_code2/3: BAYSPAR TEX86 comparison
    - baysplinepy>=0.0.1    # SI_code2/3: BAYSPLINE UK'37 comparison
    - bayfox                # SI_code2/3: BAYFOX foram δ18O comparison
    - texas-psm>=0.1.9
