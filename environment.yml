name: texas-env
channels:
  - conda-forge
channel_priority: strict

dependencies:
  # --- Core & Environment ---
  - python=3.10
  - pip
  - jupyterlab
  - ipywidgets
  - tqdm

  # --- Core Scientific Stack ---
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - statsmodels
  - seaborn
  
  # --- Core Data Handling ---
  - xarray
  - dask
  - distributed
  - zarr
  - netcdf4
  - h5netcdf
  - cftime

  # --- Plotting (Stable Pinned Versions) ---
  - matplotlib<3.5
  - proplot=0.9.7
  - setuptools<81
  - cmocean
  - plotly
  
  # --- Geo Stack (Complex Dependencies) ---
  - geopandas=0.13.*
  - shapely<2
  - pyproj=3.4.*
  - cartopy=0.21.*
  - pyshp=2.3.*
  - "pyproj<3.6"
  - rtree
  - pyogrio
  - mapclassify
  - geopy

  # --- xESMF Stack (Complex Dependencies) ---
  - xesmf
  - esmpy
  - esmf
  - mpich
  - hdf5
  - libnetcdf

  # --- Stan & Other Tools ---
  - cmdstanpy>=1.0
  - stanio
  - typing-extensions
  - anywidget
  - ipylab
  - duckdb
  - pyarrow
  - sqlalchemy
  - pydantic
  - importlib-metadata<5.0

  # --- Pip-only packages & Local Install ---
  - pip:
    - baysplinepy
    - baysparpy
    - pygwalker
    - -e .