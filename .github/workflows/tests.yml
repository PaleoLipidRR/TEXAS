name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src/TEXAS/**"
      - "tests/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/TEXAS/**"
      - "tests/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/tests.yml"

jobs:
  # Full suite in the documented conda environment (Python 3.10, pandas 2.x),
  # which provides the geo stack (cartopy, regionmask, …).
  pytest-conda:
    name: pytest (conda, pandas 2.x)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}  # login shell so the conda env is activated
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install TEXAS (editable) + pytest
        run: |
          pip install -e .
          pip install pytest

      # Pure-Python tests only — no Stan compilation needed, so CmdStan is
      # not installed here.
      - name: Run test suite
        run: pytest -q

  # pandas 3.0 removed implicit dtype coercions (e.g. bool -> float64 setitem)
  # that 2.x only deprecates. Users run 3.0, so exercise it. NOTE: pandas 3.0
  # requires Python >=3.11, so this CANNOT run in the 3.10 conda env — it uses a
  # standalone 3.12 + pip core install (geo stack is optional; imports are
  # guarded, so `import TEXAS` and the pandas-sensitive tests run fine).
  pytest-pandas3:
    name: pytest (pip, pandas 3.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TEXAS + pandas 3.0 + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pandas>=3.0,<4" pytest

      - name: Run test suite
        run: pytest -q
