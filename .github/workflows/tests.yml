name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src/TEXAS/**"
      - "tests/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/TEXAS/**"
      - "tests/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: pytest (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default pandas from environment.yml.
          - name: pandas-default
            pandas_spec: ""
          # pandas 3.0 removed several implicit dtype coercions (e.g. bool ->
          # float64 setitem) that 2.x only deprecates with a FutureWarning.
          # Users run 3.0, so exercise it here to catch those before release.
          - name: pandas-3
            pandas_spec: "pandas>=3.0,<4"
    defaults:
      run:
        shell: bash -el {0}  # login shell so the conda env is activated
    steps:
      - uses: actions/checkout@v4

      # Reproduce the documented conda environment (provides the geo stack:
      # cartopy, regionmask, etc. that `import TEXAS` requires).
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install TEXAS (editable) + pytest
        run: |
          pip install -e .
          pip install pytest

      - name: Override pandas version
        if: matrix.pandas_spec != ''
        run: pip install "${{ matrix.pandas_spec }}"

      # Pure-Python tests only — no Stan compilation needed, so CmdStan is
      # not installed here.
      - name: Run test suite
        run: pytest -q
