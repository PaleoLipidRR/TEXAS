name: Deploy docs

# Builds the unified Jupyter Book in docs/ (Sphinx) — which now contains the
# guide pages, the autodoc API reference, the explainers, AND the tutorial —
# and publishes the single site to gh-pages.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/TEXAS/**"   # autodoc reads docstrings from the source
      - ".github/workflows/docs.yml"
  # Build (but do not publish) on PRs that touch the book. tests.yml is
  # path-filtered to src/, tests/, pyproject.toml and environment.yml, so
  # without this a docs-only PR runs NO checks at all -- and the build is the
  # only thing that catches a deleted page, a broken _toc.yml entry or a dead
  # cross-reference. Four such PRs merged unchecked on 2026-09-08.
  pull_request:
    paths:
      - "docs/**"
      - "src/TEXAS/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# gh-pages is force-pushed, so two deploys finishing together race for the ref
# and one fails with "cannot lock ref". That happened on 2026-09-08 when two
# PRs merged a minute apart. Serialize instead, and never cancel a deploy
# midway -- a half-published site is worse than a queued one.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # build_sampler_budget.py reads data/revision1/**/*.csv, and *.csv is
          # LFS-tracked (.gitattributes). Without this, checkout leaves POINTER
          # files, pandas parses "version https://git-lfs..." as the header, and
          # the build dies with KeyError: 'model'.
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TEXAS (for autodoc) + Jupyter Book
        # autodoc imports TEXAS; the heavy/optional geo deps are mocked in
        # _config.yml (autodoc_mock_imports), so the core install suffices.
        run: |
          pip install -e .
          pip install "jupyter-book<2"

      # Regenerated from src/TEXAS on every deploy so the call graph, the
      # reachability report, and the API can never drift apart. Fails loudly if
      # callmap_content.py names a function that no longer exists.
      - name: Regenerate the call map
        run: python docs/_scripts/build_callmap.py

      # The sweep output is gitignored, so CI rebuilds this page from the
      # committed _static/sampler-budget.data.json snapshot. With neither
      # present the script leaves the committed page alone rather than
      # publishing an empty one.
      - name: Regenerate the sampler-budget report
        run: python docs/_scripts/build_sampler_budget.py

      - name: Build the book
        run: jupyter-book build docs/

      # peaceiris adds .nojekyll so Sphinx's _static/_sources dirs serve;
      # force_orphan keeps gh-pages a single clean commit.
      #
      # PRs stop at the build above. Without this guard every PR would
      # force-push gh-pages, publishing unmerged work to the live site and
      # racing real deploys -- so the `if` is what makes the pull_request
      # trigger safe, not an optimization.
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          force_orphan: true
