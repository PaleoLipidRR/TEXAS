name: Lint

# Lint-only (ruff check, pyflakes rules) — fast, pip-only, no conda env.
# Formatting is left to the local pre-commit hook, so CI does not fail on
# unformatted-but-valid code.
on:
  push:
    branches: [main]
    paths:
      - "src/TEXAS/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "src/TEXAS/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.9.7"
