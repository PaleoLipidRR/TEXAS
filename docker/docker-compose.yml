services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    container_name: texas_gui
    ports:
      - "8503:8501"    # host:container
    environment:
      TEXAS_INV_CACHE: "/app/data/cache/TEXAS_invT_posterior_cache"
      TEXAS_FWD_CACHE: "/app/data/cache/TEXAS_posterior_cache"
    volumes:
      - ../data:/app/data:ro
      - ../spreadsheets:/app/spreadsheets:ro
    restart: unless-stopped
    profiles: ["app"]

  docs:
    build:
      context: ..
      dockerfile: docker/Dockerfile.docs
    container_name: texas_docs
    volumes:
      - ..:/docs
    ports:
      - "8000:8000"
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    profiles: ["docs"]

  full:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: texas_full
    command: bash
    volumes:
      - ..:/home/micromamba/app
    profiles: ["full"]

  # === NEW: PHYLOGENOMICS SERVICE ===
  phylo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.phylo  # You'll need to create this
    user: "${HOST_UID}:${HOST_GID}"
    container_name: texas_phylo
    working_dir: /workspace/data/phylo
    environment:
      - GTDBTK_DATA_PATH=/gtdb
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount your project data
      - ${PROJECT_ROOT}:/workspace:rw
      
      # Mount GTDB database from external location (READ-ONLY)
      # Option 1: If moved to home directory
      - ${HOME}/gtdb_data/release220:/gtdb:ro
      
      # Option 2: If moved to system location  
      # - /opt/gtdb/release220:/gtdb:ro
      
      # Option 3: If keeping in project (NOT RECOMMENDED for builds)
      # - ../data/phylo/release220:/gtdb:ro
      
    command: bash -c "echo 'TEXAS Phylo container ready!' && tail -f /dev/null"
    profiles: ["phylo"]