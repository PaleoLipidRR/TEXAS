p.ndarray, grid_lon: Optional[np.ndarray], grid_lat: Optional[np.ndarray], n_closest: int, max_dist_deg: float, grid_res: float) -> List[np.ma.MaskedArray]","doc":"Krige the halo for every panel in `data`.\n\nUses joblib (loky backend) when available; falls back to serial otherwise.\nSet env var KRIGE_N_JOBS to cap parallelism (1 = force serial).\n\nParameters\n----------\ndata : list of (measured, proxy, predicted, residuals, color, label)\nlons, lats : coretop coordinates\ngrid_lon, grid_lat : output grid (default: 1° WOA23-aligned)","x":"","priv":false,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps.make_true_grid":{"n":"make_true_grid","m":"plotting.residual_maps","c":null,"nest":null,"l":254,"e":291,"sig":"make_true_grid(lons: np.ndarray, lats: np.ndarray, residuals: np.ndarray, grid_lon: Optional[np.ndarray], grid_lat: Optional[np.ndarray], grid_res: float) -> np.ma.MaskedArray","doc":"Place true residuals onto the 0.25° WOA23 grid via vectorised np.add.at.\nMultiple coretops snapping to the same cell are averaged.\nReturns a masked array (unmasked only at data cells).","x":"","priv":false,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps.load_or_build_halo_cache":{"n":"load_or_build_halo_cache","m":"plotting.residual_maps","c":null,"nest":null,"l":294,"e":356,"sig":"load_or_build_halo_cache(cache_path: str, data: list, lons: np.ndarray, lats: np.ndarray, grid_lon: Optional[np.ndarray], grid_lat: Optional[np.ndarray], n_closest: int, max_dist_deg: float, grid_res: float, recompute) -> List[np.ma.MaskedArray]","doc":"Load halo grids from ``cache_path`` (.npz), or recompute and save if needed.\n\nParameters\n----------\nrecompute : bool or ``'auto'``\n    - ``False``  : load from cache; raise ``FileNotFoundError`` if not found.\n    - ``True``   : always recompute and overwrite the cache.\n    - ``'auto'`` : load from cache if it exists, otherwise compute and save.","x":"","priv":false,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps.load_or_build_grids_cache":{"n":"load_or_build_grids_cache","m":"plotting.residual_maps","c":null,"nest":null,"l":359,"e":430,"sig":"load_or_build_grids_cache(cache_path: str, data: list, lons: np.ndarray, lats: np.ndarray, grid_lon_halo: Optional[np.ndarray], grid_lat_halo: Optional[np.ndarray], grid_lon_true: Optional[np.ndarray], grid_lat_true: Optional[np.ndarray], n_closest: int, max_dist_deg: float, grid_res: float, recompute) -> Tuple[List[np.ma.MaskedArray], List[np.ma.MaskedArray]]","doc":"Load halo + true grids from cache, or recompute and save if needed.\n\nReturns (halo_grids, true_grids)","x":"","priv":false,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps._extent_mask":{"n":"_extent_mask","m":"plotting.residual_maps","c":null,"nest":null,"l":437,"e":439,"sig":"_extent_mask(lons, lats, extent)","doc":"","x":"","priv":true,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps._regionmask_mask":{"n":"_regionmask_mask","m":"plotting.residual_maps","c":null,"nest":null,"l":442,"e":451,"sig":"_regionmask_mask(lons, lats, region_name)","doc":"","x":"","priv":true,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps._visible_window":{"n":"_visible_window","m":"plotting.residual_maps","c":null,"nest":null,"l":463,"e":473,"sig":"_visible_window(ax, pad: float)","doc":"Return the lon/lat box a zoom panel actually shows, plus *pad*.\n\n`set_extent()` fits the *projected* bounding box of the requested extent, so\nthe visible window is wider than what was asked for (Eckert III meridians\nconverge poleward: a [-10, 43] request shows out to ~46 degrees E). Trimming\nto the requested extent alone would clip visible geometry, so trim to this\ninstead.","x":"","priv":true,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps._clipped_feature":{"n":"_clipped_feature","m":"plotting.residual_maps","c":null,"nest":null,"l":476,"e":502,"sig":"_clipped_feature(feature, window)","doc":"Return *feature* with its geometries cropped to the *window* box.\n\nCartopy's FeatureArtist selects whole geometries by bounding-box overlap, so\na Mediterranean panel still embeds the complete Eurasia and Africa polygons\nin vector output — invisible behind the axes clip path, but they inflate the\nPDF/SVG and make the panel painful to edit in Inkscape (dragging the\ncoastline drags a continent). Intersecting up front keeps only the vertices\nthat fall inside the panel.","x":"","priv":true,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps._fill_map":{"n":"_fill_map","m":"plotting.residual_maps","c":null,"nest":null,"l":505,"e":592,"sig":"_fill_map(ax, z_halo: np.ma.MaskedArray, z_true: np.ma.MaskedArray, lons: np.ndarray, lats: np.ndarray, norm, grid_lon_halo: np.ndarray, grid_lat_halo: np.ndarray, grid_lon_true: np.ndarray, grid_lat_true: np.ndarray, extent, cmap: str, scatter_s: float, scatter_lw: float)","doc":"Render halo + true-data layers and coretop markers onto a Cartopy axes.","x":"","priv":true,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps._circled_number":{"n":"_circled_number","m":"plotting.residual_maps","c":null,"nest":null,"l":595,"e":614,"sig":"_circled_number(ax, x, y, number, fontsize, pad, facecolor, edgecolor, linewidth, zorder, transform, clip_on)","doc":"Place a circled number annotation on *ax*.","x":"","priv":true,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps._section_header":{"n":"_section_header","m":"plotting.residual_maps","c":null,"nest":null,"l":617,"e":653,"sig":"_section_header(fig, axs, row_left: int, row_right: int, y_axfrac: float, label: str, color, fontsize, lw)","doc":"Bold label right-aligned to axs[row_right, -1], with a horizontal rule\nextending to the left edge of axs[row_left, 0].\nMust be called after fig.canvas.draw() so transforms are finalised.","x":"","priv":true,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps.plot_residual_maps":{"n":"plot_residual_maps","m":"plotting.residual_maps","c":null,"nest":null,"l":660,"e":1214,"sig":"plot_residual_maps(data: list, lons: np.ndarray, lats: np.ndarray, *, temp_param: Optional[str], y_param: Optional[str], residual_tag: str, cache_path: Optional[str], recompute, krige_res: float, max_dist_deg: float, n_closest: int, vlim: float, vmin: Optional[float], vmax: Optional[float], boundary_step: float, cmap: str, colorbar_label: str, colorbar_ticks: Optional[Sequence], lon_center: Optional[float], med_extent: Sequence, rs_extent: Sequence, section_headers: Optional[List[Tuple[int, int, str]]], annotations: Optional[List[Tuple[float, float, str]]], metrics, row_annotations: Optional[List[str]], fig_width: float, hspace: Optional[Union[List[float], float]], show_grid: bool, zoom_show_rmse: bool, zoom_show_median_sigma: bool, rmse_fmt: str, rmse_unit: str, save_dir: Optional[str], fname: Optional[str], dpi: int)","doc":"Draw the proxy residual maps figure.\n\nParameters\n----------\ndata : list of 6-tuples\n    Each entry: (measured, proxy, predicted, residuals, color, method_label)\n    ``residuals`` and other array-likes may be pandas Series or np.ndarray.\nlons, lats : np.ndarray\n    Coretop coordinates.\ntemp_param : str, optional\n    Temperature column name (e.g. ``\"SST\"``, ``\"t_sf2tc_avg\"``).\n    Used with ``y_param`` to auto-generate the cache filename.\ny_param : str, optional\n    Proxy column name (e.g. ``\"scaledRI\"``, ``\"scaledRI_cren3\"``).\n    Used with ``temp_param`` to auto-generate the cache filename.\nresidual_tag : str\n    Short identifier for the type of residuals being kriged (e.g.\n    ``\"proxy_res\"``, ``\"temp_res\"``).  Baked into the auto-generated\n    cache filename to prevent collisions between calls with the same\n    ``temp_param``/``y_param`` but different residual content.\ncache_path : str, optional\n    Explicit path to the .npz grids cache.  When omitted and both\n    ``temp_param`` and ``y_param`` are set, auto-generated as\n    ``data/cache/kriged_grids_{res}deg_{dist}dmax_woa23_{temp_param}_{y_param}_{residual_tag}.npz``\n    inside the project root. Now caches both halo and true grids for faster plotting.\nrecompute : bool or ``'auto'``\n    - ``False``  : load grids from cache; raise ``FileNotFoundError`` if not found.\n…","x":"","priv":false,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps.plot_residual_maps._region_metrics":{"n":"_region_metrics","m":"plotting.residual_maps","c":null,"nest":"plot_residual_maps","l":830,"e":846,"sig":"_region_metrics(ext, meas_vals, pred_vals, region_name)","doc":"","x":"","priv":true,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps.plot_residual_maps._region_median":{"n":"_region_median","m":"plotting.residual_maps","c":null,"nest":"plot_residual_maps","l":848,"e":861,"sig":"_region_median(ext, vals, region_name)","doc":"","x":"","priv":true,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps.plot_residual_maps._gs_row":{"n":"_gs_row","m":"plotting.residual_maps","c":null,"nest":"plot_residual_maps","l":928,"e":930,"sig":"_gs_row(r: int) -> int","doc":"Map logical data row → GridSpec row index (skipping spacers).","x":"","priv":true,"path":"src/TEXAS/plotting/residual_maps.py"},"predict.predict_proxy_from_T":{"n":"predict_proxy_from_T","m":"predict","c":null,"nest":null,"l":52,"e":134,"sig":"predict_proxy_from_T(temperatures: Union[np.ndarray, List[float]], posterior: Union[xr.Dataset, str], *, n_draws: int, percentiles: List[float], return_full: bool, seed: int, gdgt23ratio: Optional[np.ndarray], no3: Optional[np.ndarray], no3_cutoff: Optional[float], suffix: Optional[str], fwd_cache_dir: Optional[Union[str, Path]]) -> Dict[str, np.ndarray]","doc":"Forward prediction: temperature → proxy percentiles (Scaled RI, TEX86, or any fitted proxy).\n\nSamples `n_draws` self-consistent parameter sets from the forward\ncalibration posterior (all parameters drawn from the same posterior\nindex, preserving correlations) and evaluates the calibration curve\nat each requested temperature.  Corresponds to the forward model\ndescribed in Eq. 1 / Eq. 6–7 of the manuscript.\n\nParameters\n----------\ntemperatures : array-like\n    Temperatures (°C) at which to evaluate the calibration curve.\nposterior : xr.Dataset or str\n    Forward calibration posterior — either a loaded xr.Dataset or\n    a saved-file name string (looked up in the posterior cache).\nn_draws : int\n    Number of posterior draws to sample.  Default 500.\npercentiles : list of float\n    Percentiles to return, e.g. [5, 50, 95].\nreturn_full : bool\n    If True, also return the full (n_draws × len(temperatures))\n    ensemble array and run metadata under keys ``\"ensemble\"`` and\n    ``\"metadata\"``.\nseed : int\n    Random seed for reproducible draw sampling.\ngdgt23ratio : array-like, optional\n    GDGT-2/GDGT-3 ratio values (one per temperature point).\n    Required only when the posterior was fitted with the multivariate\n    model (β_{G₂/₃} correction).\nno3 : array-like, optional\n    Nitrate concentration values (one per temperature point).\n…","x":"The forward half of the public API. Give it temperatures and a forward posterior and it returns proxy percentiles. It does no sampling of its own: it loads the posterior if you passed a name, then hands everything to generate_ensemble_auto. If the posterior was fitted with the multivariate model you must also supply gdgt23ratio / no3 arrays, one value per temperature point.","priv":false,"path":"src/TEXAS/predict.py"},"predict.predict_T_from_proxyObs":{"n":"predict_T_from_proxyObs","m":"predict","c":null,"nest":null,"l":137,"e":397,"sig":"predict_T_from_proxyObs(proxyObs: Union[np.ndarray, List[float]], prior_mu_t: Union[np.ndarray, float], prior_sigma_t: float, fwd_posterior: Optional[Union[str, xr.Dataset]], *, proxy_name: Optional[str], temptype: Optional[str], site_name: Optional[str], predictors: Optional[Dict[str, np.ndarray]], no3: Optional[Union[float, np.ndarray]], gdgt23ratio: Optional[Union[float, np.ndarray]], site_lat: Optional[Union[float, np.ndarray]], site_lon: Optional[Union[float, np.ndarray]], no3_dataset: Optional[xr.Dataset], no3_dataset_var: str, config: Optional[InvTConfig], chains: int, iter_warmup: int, iter_sampling: int, seed: int, constraint_type: Literal['unconstrained', 'hard_constraint', 'truncated_prior', 'reparameterized', 'soft'], min_temp: Optional[float], threads_per_chain: Optional[int], save_results: bool, save_draws: bool, filename_tag: Optional[Union[str, Sequence[str]]], cache_dir: Optional[Union[str, Path]], fwd_cache_dir: Optional[Union[str, Path]]) -> Dict[str, Any]","doc":"Inverse reconstruction: scaled RI → temperature percentiles.\n\nRuns the TEXAS-Bay inverse Stan model to infer paleotemperature from\nobserved scaled Ring Index values.  Marginalises over M draws from\nthe forward calibration posterior to propagate calibration uncertainty\ninto the temperature reconstruction.  Corresponds to Section 8\n(Applications to Paleothermometry) of the manuscript.\n\nParameters\n----------\nproxyObs : array-like, shape (N,)\n    Observed proxy values from downcore or coretop samples (e.g. scaledRI, TEX86).\nprior_mu_t : float or array-like, shape (N,)\n    Prior mean temperature (°C).  Scalar applies the same prior to all\n    N observations; array sets a site-specific prior per sample.\nprior_sigma_t : float\n    Prior temperature uncertainty (°C).  Use a diffuse value (e.g. 10)\n    when little prior information is available.\nfwd_posterior : str or xr.Dataset, optional\n    The forward calibration posterior.  Accepts either:\n\n    - **str** — name of the saved posterior (without ``.nc`` extension)\n      in the posterior cache directory.  The file is loaded automatically.\n    - **xr.Dataset** — a pre-loaded posterior Dataset.  No file I/O or\n      Zenodo download is attempted; pass this when the cache is unavailable\n      (e.g. Google Colab with a Drive-mounted ``.nc``)::\n\n          ds = xr.open_dataset(\"my_drive/posterior.nc\")\n…","x":"The inverse half of the public API, and the function most paleo users actually call. It accepts proxy observations plus a temperature prior (mu, sigma), optionally resolves modern NO3 from site coordinates against a WOA23-derived dataset, and delegates to predict_temperature_from_proxyObs. prior_sigma_t should be diffuse (~10 degC) when you have little prior information.","priv":false,"path":"src/TEXAS/predict.py"},"predict.compute_scaledRI":{"n":"compute_scaledRI","m":"predict","c":null,"nest":null,"l":400,"e":491,"sig":"compute_scaledRI(gdgt0, gdgt1, gdgt2, gdgt3, cren, cren_prime, *, cren_weight: float, cren_rings: int) -> np.ndarray","doc":"Compute Scaled Ring Index from six isoGDGT abundances.\n\nAccepts raw LC/MS peak areas or fractional abundances — both give identical\nresults because the formula divides by the total sum of all six GDGTs, so\nany common scale factor drops out.\nDefault ``cren_weight=3`` produces **scaledRI_cren3** (RI₀₋₃), the canonical\nproxy used in TEXAS calibration posteriors.\n\nParameters\n----------\ngdgt0, gdgt1, gdgt2, gdgt3, cren, cren_prime : float or array-like\n    isoGDGT abundances — GDGT-0, GDGT-1, GDGT-2, GDGT-3, crenarchaeol,\n    crenarchaeol regioisomer (cren').  Raw LC/MS peak areas and fractional\n    abundances give the same result (see above).\ncren_weight : float\n    Weight carried by both crenarchaeol and its regioisomer, which also\n    sets the normalisation (see Notes).\n    ``3`` → scaledRI_cren3 / RI₀₋₃ (default, recommended).\n    ``4`` → scaledRI / RI₀₋₄ (Zhang et al. 2016 convention).\ncren_rings : int, optional\n    Deprecated alias for ``cren_weight``. Emits a ``DeprecationWarning``.\n\nReturns\n-------\nnumpy.ndarray or float\n    Scaled Ring Index, dimensionless, nominally in [0, 1].\n\nNotes\n-----\nThe formula is::\n\n    RI      = (1·GDGT1 + 2·GDGT2 + 3·GDGT3 + cren_weight·cren + cren_weight·cren')\n              / (GDGT0 + GDGT1 + GDGT2 + GDGT3 + cren + cren')\n    scaledRI = RI / cren_weight\n\nThe parameter does two jobs at once: it is the coefficient on cren and\n…","x":"Converts raw GDGT fractional abundances into the scaled Ring Index used as the proxy throughout. Kept variable-name-agnostic so it is not tied to one spreadsheet's column names.","priv":false,"path":"src/TEXAS/predict.py"},"stan.compiler._stan_text_to_ascii":{"n":"_stan_text_to_ascii","m":"stan.compiler","c":null,"nest":null,"l":69,"e":79,"sig":"_stan_text_to_ascii(text: str) -> str","doc":"Return an ASCII-only rendering of Stan source *text*.\n\nKnown formatting/math symbols are transliterated for readability;\nsub/superscripts and accented letters are reduced via NFKD decomposition\n(e.g. ``T₀`` -> ``T0``); anything still non-ASCII becomes ``?``. Pure\nASCII input is returned unchanged.","x":"Rewrites non-ASCII characters in Stan source to ASCII equivalents. Needed because stanc and the Windows toolchain choke on UTF-8 in .stan files that were edited with typographic characters.","priv":true,"path":"src/TEXAS/stan/compiler.py"},"stan.compiler._copy_stan_ascii":{"n":"_copy_stan_ascii","m":"stan.compiler","c":null,"nest":null,"l":82,"e":101,"sig":"_copy_stan_ascii(src: Path, dest: Path) -> None","doc":"Copy *src* to *dest*, sanitizing to ASCII so any locale can read it.\n\nLine endings are preserved. For already-ASCII sources this writes\nbyte-identical content, so it is a drop-in replacement for a plain copy.","x":"","priv":true,"path":"src/TEXAS/stan/compiler.py"},"stan.compiler._windows_compile_path":{"n":"_windows_compile_path","m":"stan.compiler","c":null,"nest":null,"l":111,"e":169,"sig":"_windows_compile_path()","doc":"Make CmdStan's RTools toolchain win on PATH for the duration of a compile.\n\ncmdstanpy adds RTools to PATH, but another MinGW earlier on PATH (e.g.\nStrawberry Perl's g++) can still be chosen by ``mingw32-make``, yielding\n``undefined reference to std::istream::seekg`` link errors because CmdStan's\nprebuilt libraries were built with RTools' g++. For the duration of the\ncompile, prepend the RTools toolchain dirs and drop known-conflicting MinGW\ndirs, then restore the original PATH so the caller's environment is unchanged.\n\nNo-op off Windows or when the RTools toolchain cannot be located (e.g. a\nconda-forge CmdStan, which uses its own compiler and needs no reordering).","x":"Resolves the RTools-vs-Strawberry g++ conflict on Windows and restores PATH afterwards without clobbering cmdstanpy's TBB dll directory. This is the fix that made Stan usable on the Windows uv-venv setup.","priv":true,"path":"src/TEXAS/stan/compiler.py"},"stan.compiler.StanCompiler.__init__":{"n":"__init__","m":"stan.compiler","c":"StanCompiler","nest":null,"l":190,"e":194,"sig":"__init__(self, model_dir: Optional[Union[str, Path]])","doc":"","x":"","priv":false,"path":"src/TEXAS/stan/compiler.py"},"stan.compiler.StanCompiler.resolve_stan_path":{"n":"resolve_stan_path","m":"stan.compiler","c":"StanCompiler","nest":null,"l":198,"e":203,"sig":"resolve_stan_path(self, stan_file: Union[str, Path]) -> Path","doc":"Return the absolute path to the .stan source file.","x":"","priv":false,"path":"src/TEXAS/stan/compiler.py"},"stan.compiler.StanCompiler._build_path":{"n":"_build_path","m":"stan.compiler","c":"StanCompiler","nest":null,"l":205,"e":216,"sig":"_build_path(self, stan_source: Path) -> Path","doc":"Return the path under STAN_BUILD_DIR that we compile from.\n\nCopies the source file if the build copy is absent or stale. The copy\nis ASCII-sanitized (see :func:`_copy_stan_ascii`) so cmdstanpy's\nlocale-encoded file read never fails on non-ASCII comment characters.","x":"","priv":true,"path":"src/TEXAS/stan/compiler.py"},"stan.compiler.StanCompiler.get_model":{"n":"get_model","m":"stan.compiler","c":"StanCompiler","nest":null,"l":220,"e":286,"sig":"get_model(self, stan_file: Union[str, Path], cpp_options: Optional[Dict], force: bool) -> CmdStanModel","doc":"Return a compiled CmdStanModel, using an in-memory cache.\n\nArgs:\n    stan_file: Name of the .stan file (with or without extension).\n    cpp_options: Passed to CmdStanModel (e.g. {\"STAN_THREADS\": True}).\n    force: Delete cached binary and recompile from scratch.","x":"Returns a compiled CmdStanModel, hitting an in-memory cache first and the on-disk binary second. force=True clears the binary and recompiles. This is where the Windows-specific compile path and the ASCII source copy are applied.","priv":false,"path":"src/TEXAS/stan/compiler.py"},"stan.invT._attach_invT_metadata":{"n":"_attach_invT_metadata","m":"stan.invT","c":null,"nest":null,"l":30,"e":56,"sig":"_attach_invT_metadata(ds: xr.Dataset, data: dict, stan_file: str, site_name: Optional[str], model_type: Optional[str]) -> xr.Dataset","doc":"Attaches essential metadata to the posterior dataset.","x":"","priv":true,"path":"src/TEXAS/stan/invT.py"},"stan.invT.get_invT_posterior":{"n":"get_invT_posterior","m":"stan.invT","c":null,"nest":null,"l":59,"e":343,"sig":"get_invT_posterior(proxyObs: Union[np.ndarray, List[float]], prior_mu_t: Union[np.ndarray, float], prior_sigma_t: float, *, proxy_name: Optional[str], scaledRI: Union[np.ndarray, List[float]], fwd_posterior_name: Optional[str], site_name: Optional[str], temptype: Optional[str], predictors: Optional[Dict[str, np.ndarray]], config: Optional[InvTConfig], save: bool, save_draws: bool, filename_tag: Optional[Union[str, Sequence[str]]], cache_dir: Optional[Union[str, Path]], chains: Optional[int], iter_warmup: Optional[int], iter_sampling: Optional[int], seed: Optional[int], use_opencl: bool, threads_per_chain: Optional[int], stan_model_path: Optional[Union[str, Path]], model_type: Literal['direct', 'ensemble'], constraint_type: Literal['unconstrained', 'hard_constraint', 'truncated_prior', 'reparameterized', 'soft'], min_temp: Optional[float], fwd_posterior: Optional[xr.Dataset], fwd_cache_dir: Optional[Union[str, Path]]) -> xr.Dataset","doc":"Run the inverse-T model and return the posterior Dataset with metadata.\n\nArgs:\n    model_type:\n        - \"direct\": Use direct sampling models (more efficient, supports threading)\n        - \"ensemble\": Use traditional ensemble models\n    cache_dir: Where invT RESULTS are written.\n    fwd_cache_dir: Where fwd_posterior_name is READ from. Defaults to the\n        standard forward posterior cache. The two are separate directories —\n        passing cache_dir does not change where the forward posterior is\n        looked up.","x":"The orchestrator of the inverse run and the busiest function in the package. It builds the invT data (or accepts one), picks the Stan file, patches predictors, sizes the run against available memory, samples, computes quantiles, attaches metadata, and optionally writes the posterior and the raw draws. Note that cache_dir (where results are written) and fwd_cache_dir (where the forward posterior is read) are deliberately separate.","priv":false,"path":"src/TEXAS/stan/invT.py"},"stan.invT._select_invT_stan_file":{"n":"_select_invT_stan_file","m":"stan.invT","c":null,"nest":null,"l":346,"e":395,"sig":"_select_invT_stan_file(data: Dict, predictor_usage: Dict[str, bool], threads_per_chain: Optional[int], model_type: Literal['direct', 'ensemble'], constraint_type: Literal['unconstrained', 'hard_constraint', 'truncated_prior', 'reparameterized', 'soft'], no3ratio: bool, bounded: bool) -> str","doc":"Choose the correct Stan model file based on data structure.\n\nArgs:\n    model_type:\n        - \"direct\": Use direct sampling models (more efficient, supports threading)\n        - \"ensemble\": Use traditional ensemble models\n    constraint_type:\n        - \"unconstrained\": No temperature constraints\n        - \"hard_constraint\": Hard lower bound (Jacobian-biased near boundary)\n        - \"truncated_prior\": Truncated Normal prior via inverse-CDF; P50 unbiased\n        - \"reparameterized\": Exponential transformation approach\n        - \"soft\": Soft penalty for temperatures below min_temp","x":"Picks the .stan file from the shape of the problem: direct vs ensemble sampling, which optional predictors are active, and the temperature constraint scheme (unconstrained, hard_constraint, truncated_prior, reparameterized, soft). truncated_prior is the one that keeps P50 unbiased near a lower bound; hard_constraint is Jacobian-biased there.","priv":true,"path":"src/TEXAS/stan/invT.py"},"stan.invT.get_invT_post_quantiles":{"n":"get_invT_post_quantiles","m":"stan.invT","c":null,"nest":null,"l":398,"e":427,"sig":"get_invT_post_quantiles(posterior: xr.Dataset, quantiles: Sequence[float]) -> xr.Dataset","doc":"Calculate quantiles for the posterior draws.\n\nSpecial handling for `t_est`:\n- Ensemble models: shape (chain, draw, N, M) → reduce over chain, draw, and M.\n- Marginal models: shape (chain, draw, N) → reduce over chain and draw.\n\nOther variables: reduce over available MCMC dims (chain, draw).","x":"Reduces draws to percentiles, with shape handling that differs by model family: ensemble models give t_est as (chain, draw, N, M) and must also reduce over M, marginal models give (chain, draw, N).","priv":false,"path":"src/TEXAS/stan/invT.py"},"stan.invT.predict_temperature_from_proxyObs":{"n":"predict_temperature_from_proxyObs","m":"stan.invT","c":null,"nest":null,"l":430,"e":538,"sig":"predict_temperature_from_proxyObs(proxyObs: Union[np.ndarray, List[float]], prior_mu_t: Union[np.ndarray, float], prior_sigma_t: float, fwd_posterior_name: Optional[str], site_name: Optional[str], temptype: Optional[str], predictors: Optional[Dict[str, np.ndarray]], config: Optional[InvTConfig], chains: int, iter_warmup: int, iter_sampling: int, seed: Optional[int], save_results: bool, save_draws: bool, filename_tag: Optional[Union[str, Sequence[str]]], results_path: Optional[Union[str, Path]], cache_dir: Optional[Union[str, Path]], use_opencl: bool, threads_per_chain: Optional[int], stan_model_path: Optional[Union[str, Path]], model_type: Literal['direct', 'ensemble'], constraint_type: Literal['unconstrained', 'hard_constraint', 'truncated_prior', 'reparameterized', 'soft'], min_temp: Optional[float], fwd_posterior: Optional[xr.Dataset], proxy_name: Optional[str], fwd_cache_dir: Optional[Union[str, Path]], *, scaledRI: Union[np.ndarray, List[float]]) -> Dict[str, Any]","doc":"High-level wrapper to run the inverse model and get temperature percentiles.\n\nArgs:\n    model_type:\n        - \"direct\": Use direct sampling models (more efficient, supports threading)\n        - \"ensemble\": Use traditional ensemble models","x":"High-level wrapper around get_invT_posterior that returns temperature percentiles and, optionally, writes a tidy results table.","priv":false,"path":"src/TEXAS/stan/invT.py"},"stan.io.save_posterior":{"n":"save_posterior","m":"stan.io","c":null,"nest":null,"l":25,"e":156,"sig":"save_posterior(posterior: xr.Dataset, cache_dir: Optional[Union[str, Path]], overwrite: bool, filename_suffix: str, layout: Literal['auto', 'case', 'legacy'], run: Union[str, int]) -> Path","doc":"Save a forward-model posterior to disk as compressed NetCDF.\n\nThe filename is auto-generated from the posterior's metadata attrs:\n``{model}_{temptype}[_gdgt23ratio][_no3_{cutoff}][_{proxy_name}]{suffix}.nc``\n\nParameters\n----------\nposterior : xr.Dataset\n    Forward calibration posterior returned by ``get_posterior()``.\n    Must have ``stan_model_name``, ``temptype``, and ``proxy_name``\n    attrs set (``proxy_name`` is required — a warning is raised if\n    missing).\ncache_dir : str or Path, optional\n    Directory to write the file.  Defaults to the standard forward\n    posterior cache (``data/cache/TEXAS_posterior_cache/`` for\n    source installs, ``~/.texas/cache/TEXAS_posterior_cache/`` for\n    pip installs).\noverwrite : bool\n    If ``False``, raise ``FileExistsError`` when the output path\n    already exists.  Default ``True``.\nfilename_suffix : str, optional\n    Extra tag appended before ``.nc`` under the *legacy* layout, and the\n    run/member token under the case layout.  Leading/trailing underscores\n    are stripped.  **Do not pass a date here.**  Filenames no longer carry\n    date stamps; the run date is recorded in the ``run_timestamp`` attr,\n    where it survives a rename and does not have to be parsed back out of\n    a path.  Prefer ``run=`` for an explicit member.\nrun : str or int, optional\n    Optional run/member token under the case layout.  ``\"auto\"`` (default)\n…","x":"Writes the posterior as compressed NetCDF into the forward cache. The filename is built from model, temptype, optional predictor flags, and proxy_name, so a filename identifies a run.","priv":false,"path":"src/TEXAS/stan/io.py"},"stan.io.load_posterior":{"n":"load_posterior","m":"stan.io","c":null,"nest":null,"l":159,"e":234,"sig":"load_posterior(model_name: str, model_type: Literal['forward', 'invT'], cache_dir: Optional[Union[str, Path]]) -> xr.Dataset","doc":"Load a posterior from disk: `{model_name}.nc` in the appropriate cache directory.\n\nArgs:\n    model_name: Name of the model file (without .nc extension)\n    model_type: Type of posterior (\"forward\" or \"invT\")\n    cache_dir: Custom cache directory (overrides default locations)\n\nReturns:\n    xarray.Dataset containing the posterior\n    \nRaises:\n    FileNotFoundError: If the posterior file doesn't exist","x":"Loads {model_name}.nc from the forward or invT cache, or from an explicit cache_dir. Raises FileNotFoundError rather than silently returning empty.","priv":false,"path":"src/TEXAS/stan/io.py"},"stan.io.list_posteriors":{"n":"list_posteriors","m":"stan.io","c":null,"nest":null,"l":237,"e":288,"sig":"list_posteriors(model_type: Literal['forward', 'invT', 'both'], cache_dir: Optional[Union[str, Path]]) -> Dict[str, list]","doc":"List available posterior files in the cache directory.\n\nPrints a summary and returns a dict of stem names that can be passed\ndirectly to ``predict_T_from_proxyObs(fwd_posterior=...)``.\n\nParameters\n----------\nmodel_type : \"forward\", \"invT\", or \"both\"\n    Which cache to inspect.  Default ``\"both\"``.\ncache_dir : Path or str, optional\n    Override the default cache root.  When given, both forward and invT\n    subdirectories are looked for under this path.\n\nReturns\n-------\ndict\n    ``{\"forward\": [...], \"invT\": [...]}`` — lists of stem names (no ``.nc``).","x":"","priv":false,"path":"src/TEXAS/stan/io.py"},"stan.io.list_posteriors._list":{"n":"_list","m":"stan.io","c":null,"nest":"list_posteriors","l":270,"e":279,"sig":"_list(directory: Path, label: str) -> list","doc":"","x":"","priv":true,"path":"src/TEXAS/stan/io.py"},"stan.io.save_invT_posterior":{"n":"save_invT_posterior","m":"stan.io","c":null,"nest":null,"l":291,"e":322,"sig":"save_invT_posterior(posterior: xr.Dataset, cache_dir: Optional[Union[str, Path]], overwrite: bool, filename_tag: Optional[Union[str, Sequence[str]]]) -> Path","doc":"Save an inverse-T posterior to disk as compressed NetCDF.\n\nDefault location: repo/.../TEXAS/invT_posterior_cache/\n\nThe filename comes from :func:`_generate_filename_base`, the same builder\nthe internal save path uses, so a reconstruction lands in one place however\nit was produced.\n\nThis function used to build ``{site}_{model}_{temptype}.nc`` itself, which\nomitted ``proxy_name``: a ``scaledRI`` and a ``TEX86`` reconstruction of one\nsite collided on a single path, and with the default ``overwrite=True`` the\nsecond silently replaced the first. It was also case-unaware, so it could\nnot place a reconstruction inside its calibration's case directory. Nothing\non disk used that spelling -- every cached invT posterior came from the\ninternal path -- so unifying them changes no existing file.","x":"","priv":false,"path":"src/TEXAS/stan/io.py"},"stan.io._slug":{"n":"_slug","m":"stan.io","c":null,"nest":null,"l":327,"e":329,"sig":"_slug(x: str) -> str","doc":"","x":"","priv":true,"path":"src/TEXAS/stan/io.py"},"stan.io._generate_filename_base":{"n":"_generate_filename_base","m":"stan.io","c":null,"nest":null,"l":332,"e":406,"sig":"_generate_filename_base(meta: Dict[str, Any], filename_tag: Optional[Union[str, Sequence[str]]]) -> str","doc":"Generate the base filename for saving invT results.\n\nFormat: {site}_{model}_{temptype}_{tags}_{model_type}\nModel type (direct/ensemble) goes at the end for easy identification.","x":"","priv":true,"path":"src/TEXAS/stan/io.py"},"stan.io._sanitize_attrs_for_netcdf":{"n":"_sanitize_attrs_for_netcdf","m":"stan.io","c":null,"nest":null,"l":409,"e":433,"sig":"_sanitize_attrs_for_netcdf(ds: xr.Dataset) -> xr.Dataset","doc":"Convert posterior attrs to NetCDF-compatible types.","x":"NetCDF attrs only accept a narrow set of types. This coerces everything else (dicts, None, nested lists) into storable strings so metadata survives the round trip.","priv":true,"path":"src/TEXAS/stan/io.py"},"stan.io._save_invT_posterior":{"n":"_save_invT_posterior","m":"stan.io","c":null,"nest":null,"l":436,"e":459,"sig":"_save_invT_posterior(posterior: xr.Dataset, cache_dir: Optional[Union[str, Path]], overwrite: bool, filename_tag: Optional[Union[str, Sequence[str]]]) -> Path","doc":"Save an invT posterior with detailed auto-generated filename.","x":"","priv":true,"path":"src/TEXAS/stan/io.py"},"stan.io._save_invT_draws":{"n":"_save_invT_draws","m":"stan.io","c":null,"nest":null,"l":462,"e":487,"sig":"_save_invT_draws(draws: xr.Dataset, cache_dir: Optional[Union[str, Path]], filename_tag: Optional[Union[str, Sequence[str]]], overwrite: bool) -> Path","doc":"Save raw invT posterior draws (pre-quantile) as a compressed .nc file.\n\nThe filename mirrors the quantile posterior but with a ``_draws`` suffix,\ne.g. ``ODP1259_..._040226_direct_draws.nc``.\n\nDraws are automatically organized into a ``draws/`` subdirectory.","x":"","priv":true,"path":"src/TEXAS/stan/io.py"},"stan.io._save_invT_results":{"n":"_save_invT_results","m":"stan.io","c":null,"nest":null,"l":490,"e":511,"sig":"_save_invT_results(results: Dict[str, Any], path: Optional[Union[str, Path]], overwrite: bool) -> Path","doc":"Save invT quantile results dict as a compressed .npz file.","x":"","priv":true,"path":"src/TEXAS/stan/io.py"},"stan.metadata.extract_and_update_metadata":{"n":"extract_and_update_metadata","m":"stan.metadata","c":null,"nest":null,"l":31,"e":145,"sig":"extract_and_update_metadata(ds: xr.Dataset, data: Dict[str, Any], stan_filename: str, site_name: Optional[str], version: str, suffixes: List[str], direct_keys: List[str]) -> xr.Dataset","doc":"Attach run‐time metadata and summaries to an xarray.Dataset.\n\nParameters\n----------\nds : xr.Dataset\n  The dataset of posterior draws.\ndata : dict\n  The original dict passed to Stan.\nstan_filename : str\n  Base name of the compiled .stan file.\nsite_name : str, optional\n  A label for this run (e.g. coretop site).\nversion : str, optional\n  Your package or model version.\nsuffixes : list of str, optional\n  Which suffixes to scan for proxyObs_* and predictor_* arrays.\ndirect_keys : list of str, optional\n  Which scalar or array keys to pull directly from `data`.","x":"Attaches run metadata to the posterior Dataset: model name, temptype, priors, duration, data summaries and diagnostics. This is what makes downstream auto-detection possible, so a posterior missing these attrs will not work with generate_ensemble_auto.","priv":false,"path":"src/TEXAS/stan/metadata.py"},"stan.metadata._summarize_array":{"n":"_summarize_array","m":"stan.metadata","c":null,"nest":null,"l":147,"e":155,"sig":"_summarize_array(name: str, arr: np.ndarray) -> Dict[str, Any]","doc":"Return mean/std/min/max/len for an array under a given key.","x":"","priv":true,"path":"src/TEXAS/stan/metadata.py"},"stan.metadata.extract_param_bounds_from_stan":{"n":"extract_param_bounds_from_stan","m":"stan.metadata","c":null,"nest":null,"l":160,"e":233,"sig":"extract_param_bounds_from_stan(stan_path: Union[str, Path], data: Optional[Dict[str, float]]) -> Dict[str, str]","doc":"Parse ``<lower=…, upper=…>`` bounds from a .stan file's *parameters* block.\n\nStan supports two ways of truncating a prior, and they are not\ninterchangeable when the prior is drawn:\n\n* an explicit ``T[a, b]`` on the sampling statement, and\n* a bound on the declaration, which truncates *implicitly* — e.g.\n  ``real<lower=0> gamma;`` with ``gamma ~ normal(0, 1);`` is a HALF-normal.\n\nOnly the first is visible in the model block, so a prior read from there\nalone can show mass where the sampler is unable to go.  This returns the\nsecond, formatted as the inside of a ``T[…]`` so it can be merged in.\n\nIf `data` is given, symbolic bounds found in `data` (e.g. ``no3_cutoff``)\nare substituted with their numeric values.\n\nReturns\n-------\ndict\n    ``{param_name: \"lo, hi\"}`` — either side may be empty for a one-sided\n    bound.  Unbounded parameters are omitted entirely.","x":"","priv":false,"path":"src/TEXAS/stan/metadata.py"},"stan.metadata.extract_param_bounds_from_stan._resolve":{"n":"_resolve","m":"stan.metadata","c":null,"nest":"extract_param_bounds_from_stan","l":213,"e":218,"sig":"_resolve(v: Optional[str]) -> str","doc":"","x":"","priv":true,"path":"src/TEXAS/stan/metadata.py"},"stan.metadata.extract_priors_from_stan":{"n":"extract_priors_from_stan","m":"stan.metadata","c":null,"nest":null,"l":236,"e":296,"sig":"extract_priors_from_stan(stan_path: Union[str, Path], data: Optional[Dict[str, float]], include_param_bounds: bool) -> Dict[str, str]","doc":"Parse priors from a .stan file’s model block.\n\nIf `data` is given, symbolic args found in `data` will be substituted\nwith their numeric values when formatting the prior string.\n\nWhen `include_param_bounds` is True (default), declaration bounds from the\nparameters block are folded into the prior string as ``T[lo, hi]`` for any\nparameter whose sampling statement carries no explicit truncation.  Without\nthis, an implicitly truncated prior — ``real<lower=0> g;`` with\n``g ~ normal(0, 1);`` — reads back as a full normal rather than a\nhalf-normal.  See :func:`extract_param_bounds_from_stan`.","x":"Parses the .stan source to recover the prior expressions actually used, so the priors stored in the .nc are the ones in the model file rather than a hand-maintained copy.","priv":false,"path":"src/TEXAS/stan/metadata.py"},"stan.sampler._with_diagnostics":{"n":"_with_diagnostics","m":"stan.sampler","c":null,"nest":null,"l":21,"e":41,"sig":"_with_diagnostics(fit) -> xr.Dataset","doc":"Convert a fit to draws and stamp the stan_diag_* summary onto it.\n\nThis has to happen here, not in a caller. The CmdStanMCMC object is the only\nthing that knows R-hat, ESS and the divergence count, and it goes out of\nscope when this returns; the inverse-temperature path then reduces the draws\nto quantiles before saving, so a reconstruction that lost its diagnostics\nhere can never have them recomputed from the saved file.\n\nDiagnostics are advisory, so a failure to summarise must not lose a\ncompleted fit -- the sampling is the expensive part.","x":"","priv":true,"path":"src/TEXAS/stan/sampler.py"},"stan.sampler._attach_sampler_config":{"n":"_attach_sampler_config","m":"stan.sampler","c":null,"nest":null,"l":45,"e":67,"sig":"_attach_sampler_config(ds: xr.Dataset, fit: CmdStanMCMC) -> xr.Dataset","doc":"Record the sampler budget that produced these draws.\n\narviz supplies ``num_draws_sampling``, but nothing recorded the warmup\nlength, and it cannot be recovered from the file afterwards -- so a\nposterior could not say what budget produced it, which matters once a\nsensitivity analysis starts recommending budgets.\n\nRead from the fit rather than from the caller's kwargs, so CmdStan's own\ndefaults are recorded too and not just the arguments that were passed\nexplicitly.","x":"","priv":true,"path":"src/TEXAS/stan/sampler.py"},"stan.sampler.StanSampler.__init__":{"n":"__init__","m":"stan.sampler","c":"StanSampler","nest":null,"l":73,"e":74,"sig":"__init__(self, compiler: StanCompiler)","doc":"","x":"","priv":false,"path":"src/TEXAS/stan/sampler.py"},"stan.sampler.StanSampler.sample_from_model":{"n":"sample_from_model","m":"stan.sampler","c":"StanSampler","nest":null,"l":76,"e":128,"sig":"sample_from_model(self, model: CmdStanModel, data: Dict, **kwargs) -> xr.Dataset","doc":"Runs the sampler from a pre-compiled CmdStanModel object.","x":"Samples from an already-compiled CmdStanModel. Its notable job is recovering from exit code 127, which means the cached binary is incompatible with the current runtime (typically a TBB mismatch between a Docker image and the host env). It deletes the stale binary, recompiles, evicts the compiler's in-memory cache entry, and retries once.","priv":false,"path":"src/TEXAS/stan/sampler.py"},"stan.sampler.StanSampler.sample":{"n":"sample","m":"stan.sampler","c":"StanSampler","nest":null,"l":130,"e":182,"sig":"sample(self, data: Dict[str, Any], stan_file: str, cpp_options: Dict, **kwargs) -> Tuple[xr.Dataset, str]","doc":"Compiles, runs the sampler, and processes the output.","x":"The real workhorse: compile, sample, time the run, diagnose, convert draws to xarray, then attach metadata, priors and diagnostics as attrs. Application-specific kwargs (temptype, proxy_name, site_name, version, recompile) are popped off before the rest go to CmdStanPy.","priv":false,"path":"src/TEXAS/stan/sampler.py"},"stan.sampler.StanSampler._to_xarray":{"n":"_to_xarray","m":"stan.sampler","c":"StanSampler","nest":null,"l":184,"e":186,"sig":"_to_xarray(self, fit: CmdStanMCMC) -> xr.Dataset","doc":"Converts a CmdStanPy Fit to an xarray.Dataset.","x":"","priv":true,"path":"src/TEXAS/stan/sampler.py"},"stan.sampler.get_posterior":{"n":"get_posterior","m":"stan.sampler","c":null,"nest":null,"l":190,"e":370,"sig":"get_posterior(data: dict, stan_file: str, temptype: str, proxy_name: str, *, iter_warmup: Optional[int], iter_sampling: Optional[int], threads_per_chain: Optional[int], chains: Optional[int], parallel_chains: Optional[int], adapt_delta: Optional[float], max_treedepth: Optional[int], **kwargs) -> Tuple[xr.Dataset, str]","doc":"Run forward calibration Stan sampling and return the posterior.\n\nWraps ``StanSampler`` with automatic predictor detection, CPU\nconfiguration, and metadata attachment.  The returned dataset can be\npassed directly to ``predict_proxy_from_T`` or saved with\n``save_posterior``.\n\nParameters\n----------\ndata : dict\n    Stan data dict built by ``build_fwd_data()``.  Predictor flags\n    (``use_gdgt23ratio``, ``use_no3``) are auto-detected from the\n    arrays present; you do not need to set them manually.\nstan_file : str\n    Stan model name (without ``.stan``), e.g.\n    ``\"gen_logi_fixed_hier_crtp_multiv_priorApprox_eiv\"``.\ntemptype : str\n    Temperature variable type, e.g. ``\"SST\"`` or ``\"thermoT\"``.\n    Stored in the posterior metadata.\nproxy_name : str\n    Proxy type, e.g. ``\"scaledRI_cren3\"``.  Required — stored in\n    the ``.nc`` attrs and validated downstream when the posterior is\n    used for inverse reconstruction.\niter_warmup : int, optional\n    HMC warmup iterations per chain (default: CmdStan default, 1000).\niter_sampling : int, optional\n    Post-warmup sampling iterations per chain (default: 1000).\nchains : int, optional\n    Number of independent chains (default: 4).\nparallel_chains : int, optional\n    Chains to run simultaneously (auto-detected from CPU count).\nthreads_per_chain : int, optional\n    Threads per chain for ``reduce_sum`` models (auto-enabled for\n…","x":"Runs a forward calibration and returns (posterior, diagnostic string). It wraps StanSampler with automatic predictor detection and CPU configuration, then attaches metadata. proxy_name is required at call time because it is written into the .nc attrs and into the filename.","priv":false,"path":"src/TEXAS/stan/sampler.py"},"stan.sampler.find_index_with_priority":{"n":"find_index_with_priority","m":"stan.sampler","c":null,"nest":null,"l":372,"e":379,"sig":"find_index_with_priority(items, priorities)","doc":"Return the index of the first item whose string contains any priority (in order).","x":"","priv":false,"path":"src/TEXAS/stan/sampler.py"},"stan.sampler._ensure_lenN_vector":{"n":"_ensure_lenN_vector","m":"stan.sampler","c":null,"nest":null,"l":382,"e":392,"sig":"_ensure_lenN_vector(enh: dict, key: str, N: int, fill: float)","doc":"Guarantee enh[key] is a 1D float list of length N (coerce scalar/wrong shape to zeros).","x":"","priv":true,"path":"src/TEXAS/stan/sampler.py"},"stan.sampler.auto_detect_predictors":{"n":"auto_detect_predictors","m":"stan.sampler","c":null,"nest":null,"l":395,"e":496,"sig":"auto_detect_predictors(data: dict) -> dict","doc":"Smart predictor detection with data validation (suffix-prioritized).","x":"Inspects the data dict, decides whether GDGT-2/3 and NO3 are actually in play, and sets the integer use_* flags Stan expects. Also translates legacy scaledRI_* keys to proxyObs_* with a DeprecationWarning, which is why old notebooks still run.","priv":false,"path":"src/TEXAS/stan/sampler.py"},"stan.sampler.sampler_invT_posterior":{"n":"sampler_invT_posterior","m":"stan.sampler","c":null,"nest":null,"l":500,"e":529,"sig":"sampler_invT_posterior(data: dict, stan_file: str, site_name: Optional[str], temptype: Optional[str], model_type: Literal['direct', 'ensemble'], **kwargs) -> Tuple[xr.Dataset, str]","doc":"Sample from invT posterior with updated model_type parameter.\n\nArgs:\n    model_type: \n        - \"direct\": Use direct sampling models (more efficient, supports threading)\n        - \"ensemble\": Use traditional ensemble models","x":"The inverse-side counterpart to get_posterior: a thin functional wrapper that builds a compiler and sampler and calls sample().","priv":false,"path":"src/TEXAS/stan/sampler.py"},"stan.utils.patch_optional_predictors":{"n":"patch_optional_predictors","m":"stan.utils","c":null,"nest":null,"l":27,"e":96,"sig":"patch_optional_predictors(data: dict) -> dict","doc":"Ensure gdgt23ratio and no3 arrays/flags/betas exist with correct shapes.\n- Handles both single-group (\"N\") and multi-group keys (\"N_crtp\", etc.)\n- NaNs → 0.0\n- Creates group-level use_* flags and also UNSUFFIXED use_* flags expected by some Stan models\n- If any use_no3*=1 and no cutoff given, defaults to 0.0 (change to raise if you prefer strict)","x":"Defensive normalisation before Stan sees the data: makes sure gdgt23ratio and no3 arrays, use_* flags and beta terms all exist with the right shapes, converts NaN to 0.0, and handles both single-group (N) and multi-group (N_crtp) key layouts. Some Stan models expect unsuffixed use_* flags as well, so it creates both.","priv":false,"path":"src/TEXAS/stan/utils.py"},"stats.f_test":{"n":"f_test","m":"stats","c":null,"nest":null,"l":20,"e":70,"sig":"f_test(rss_reduced: float, rss_full: float, k_reduced: int, k_full: int, n: int) -> tuple","doc":"F-test for nested model comparison.\n\nTests whether the additional parameters in the full model significantly\nreduce residual variance relative to the reduced model.\n\nParameters\n----------\nrss_reduced : float\n    Residual sum of squares for the reduced (fewer-parameter) model.\nrss_full : float\n    Residual sum of squares for the full model.\nk_reduced : int\n    Number of free parameters in the reduced model.\nk_full : int\n    Number of free parameters in the full model.\nn : int\n    Number of observations.\n\nReturns\n-------\nF : float\n    F-statistic.\np : float\n    p-value (right-tail probability under H0 that the full model adds\n    nothing beyond the reduced model).\n\nRaises\n------\nValueError\n    If k_full <= k_reduced or n <= k_full.","x":"","priv":false,"path":"src/TEXAS/stats.py"},"stats.bootstrap_se":{"n":"bootstrap_se","m":"stats","c":null,"nest":null,"l":73,"e":130,"sig":"bootstrap_se(fit_fn, X: np.ndarray, y: np.ndarray, p0: list, bounds: tuple, n_boot: int, seed: int) -> tuple","doc":"Row-resampling bootstrap standard errors for a scipy curve_fit model.\n\nCorrectly captures joint parameter uncertainty for collinear parameters\n(e.g. x0/Q in the generalized logistic) where the Jacobian-based\ncovariance matrix is near-singular.  Occasional failed fits on extreme\nresamples are silently skipped; if fewer than 10 replicates converge,\nall SEs are returned as NaN.\n\nParameters\n----------\nfit_fn : callable\n    Model function with signature ``f(X, *params)``.\nX : ndarray, shape (n,) or (n, p)\n    Predictor array.\ny : ndarray, shape (n,)\n    Response vector.\np0 : list\n    Initial parameter guess passed to ``curve_fit``.\nbounds : tuple\n    ``(lower_bounds, upper_bounds)`` passed to ``curve_fit``.\nn_boot : int\n    Number of bootstrap replicates (default 500).\nseed : int\n    Random seed for reproducibility (default 42).\n\nReturns\n-------\nse : ndarray, shape (n_params,)\n    Bootstrap standard error per parameter.\nboots : ndarray, shape (n_successful, n_params)\n    Full bootstrap distribution of parameter estimates.","x":"","priv":false,"path":"src/TEXAS/stats.py"},"utils.doctor._cmdstanpy_version":{"n":"_cmdstanpy_version","m":"utils.doctor","c":null,"nest":null,"l":26,"e":32,"sig":"_cmdstanpy_version() -> str | None","doc":"","x":"","priv":true,"path":"src/TEXAS/utils/doctor.py"},"utils.doctor._cmdstan_diagnosis":{"n":"_cmdstan_diagnosis","m":"utils.doctor","c":null,"nest":null,"l":35,"e":65,"sig":"_cmdstan_diagnosis() -> list[str]","doc":"Explain *why* CmdStan was not discovered.\n\nCovers the common \"the directory exists but the toolchain is missing or\nunusable\" failures that a bare \"not found\" message hides: ``CMDSTAN`` set to\na non-existent path, set to a real directory whose ``bin/stanc`` is missing\n(never built), or a ``stanc`` that exists but is not executable.","x":"","priv":true,"path":"src/TEXAS/utils/doctor.py"},"utils.doctor._cmdstan_diagnosis._probe":{"n":"_probe","m":"utils.doctor","c":null,"nest":"_cmdstan_diagnosis","l":46,"e":60,"sig":"_probe(label: str, root: Path) -> None","doc":"","x":"","priv":true,"path":"src/TEXAS/utils/doctor.py"},"utils.doctor._cmdstan_info":{"n":"_cmdstan_info","m":"utils.doctor","c":null,"nest":null,"l":68,"e":93,"sig":"_cmdstan_info() -> dict","doc":"Locate CmdStan via the TEXAS safeguard and read its version.","x":"","priv":true,"path":"src/TEXAS/utils/doctor.py"},"utils.doctor._compiler_info":{"n":"_compiler_info","m":"utils.doctor","c":null,"nest":null,"l":96,"e":131,"sig":"_compiler_info() -> dict","doc":"A working C++ compiler + make is required to compile Stan models.\n\nOn Windows the Stan toolchain is normally cmdstanpy-managed RTools (mingw\n``g++`` + ``mingw32-make``) living under ``~/.cmdstan/RTools*``. cmdstanpy\nprepends it to PATH only at compile time, not persistently — so a plain PATH\nscan reports \"no compiler\" even when models compile fine. Look inside the\nRTools install (and on PATH) so the report matches actual capability. On\nPOSIX the system ``g++``/``clang++`` + ``make`` on PATH is authoritative.","x":"","priv":true,"path":"src/TEXAS/utils/doctor.py"},"utils.doctor._compiler_info._find":{"n":"_find","m":"utils.doctor","c":null,"nest":"_compiler_info","l":117,"e":123,"sig":"_find(name: str) -> str | None","doc":"","x":"","priv":true,"path":"src/TEXAS/utils/doctor.py"},"utils.doctor._toolchain_conflict":{"n":"_toolchain_conflict","m":"utils.doctor","c":null,"nest":null,"l":134,"e":165,"sig":"_toolchain_conflict() -> str | None","doc":"On Windows, warn if a non-RTools ``g++`` shadows an installed RTools one.\n\nStrawberry Perl (or another MinGW) earlier on PATH gets picked up by\nCmdStan's ``make`` ahead of RTools; its newer libstdc++ ABI clashes with\nCmdStan's RTools-built static libs, giving \"undefined reference to\nstd::istream::seekg\" link errors. ``StanCompiler`` reorders PATH per-compile\nto avoid this, but surfacing it here lets a user fix the root cause.\nReturns a message when a conflict is detected, else ``None``.","x":"","priv":true,"path":"src/TEXAS/utils/doctor.py"},"utils.doctor.check_environment":{"n":"check_environment","m":"utils.doctor","c":null,"nest":null,"l":168,"e":201,"sig":"check_environment() -> dict","doc":"Return a structured report of the TEXAS runtime environment.\n\nDoes not print anything — use :func:`doctor` for a formatted report.","x":"","priv":false,"path":"src/TEXAS/utils/doctor.py"},"utils.doctor._unicode_ok":{"n":"_unicode_ok","m":"utils.doctor","c":null,"nest":null,"l":204,"e":216,"sig":"_unicode_ok() -> bool","doc":"True if stdout can encode the check/cross glyphs.\n\nWindows consoles default to cp1252, which cannot encode ``✓``/``✗`` and\nwould raise ``UnicodeEncodeError`` on print. Fall back to ASCII markers\nthere so ``texas-doctor`` runs in PowerShell, CMD, and Anaconda Prompt.","x":"","priv":true,"path":"src/TEXAS/utils/doctor.py"},"utils.doctor._fmt":{"n":"_fmt","m":"utils.doctor","c":null,"nest":null,"l":219,"e":222,"sig":"_fmt(ok: bool, unicode: bool) -> str","doc":"","x":"","priv":true,"path":"src/TEXAS/utils/doctor.py"},"utils.doctor.doctor":{"n":"doctor","m":"utils.doctor","c":null,"nest":null,"l":225,"e":303,"sig":"doctor(verbose: bool) -> dict","doc":"Report the TEXAS environment and whether Stan sampling will work.\n\nArgs:\n    verbose: If True (default), print a formatted report to stdout.\n\nReturns:\n    The structured report dict from :func:`check_environment`.","x":"","priv":false,"path":"src/TEXAS/utils/doctor.py"},"utils.doctor._cli_main":{"n":"_cli_main","m":"utils.doctor","c":null,"nest":null,"l":306,"e":312,"sig":"_cli_main(argv: list[str] | None) -> int","doc":"Console-script entry point (``texas-doctor``).\n\nReturns 0 if the environment is ready for Stan sampling, 1 otherwise.","x":"","priv":true,"path":"src/TEXAS/utils/doctor.py"},"utils.download._file_url":{"n":"_file_url","m":"utils.download","c":null,"nest":null,"l":38,"e":39,"sig":"_file_url(filename: str) -> str","doc":"","x":"","priv":true,"path":"src/TEXAS/utils/download.py"},"utils.download._fmt_size":{"n":"_fmt_size","m":"utils.download","c":null,"nest":null,"l":42,"e":45,"sig":"_fmt_size(size_mb: float) -> str","doc":"","x":"","priv":true,"path":"src/TEXAS/utils/download.py"},"utils.download._download_file":{"n":"_download_file","m":"utils.download","c":null,"nest":null,"l":48,"e":73,"sig":"_download_file(url: str, dest: Path, size_mb: float, force: bool) -> Path","doc":"Download a single file from *url* to *dest*.","x":"","priv":true,"path":"src/TEXAS/utils/download.py"},"utils.download.download_all":{"n":"download_all","m":"utils.download","c":null,"nest":null,"l":123,"e":145,"sig":"download_all(cache_dir: Optional[Path | str], data_dir: Optional[Path | str], force: bool) -> None","doc":"Download everything from Zenodo: forward posteriors + training data.\n\nFiles are downloaded individually; already-cached files are skipped unless\n*force=True*.  Total download is ~158 MB (dominated by the two EIV\nmultivariate posteriors at ~78 MB each).\n\nParameters\n----------\ncache_dir : Path or str, optional\n    Destination for ``.nc`` posteriors.  Defaults to the standard\n    posterior cache directory.\ndata_dir : Path or str, optional\n    Destination for training data files.  Defaults to ``data/spreadsheets/``.\nforce : bool\n    Re-download files that already exist locally.","x":"","priv":false,"path":"src/TEXAS/utils/download.py"},"utils.download.download_posteriors":{"n":"download_posteriors","m":"utils.download","c":null,"nest":null,"l":148,"e":212,"sig":"download_posteriors(names: Optional[List[str]], cache_dir: Optional[Path | str], force: bool) -> List[Path]","doc":"Download forward calibration posteriors from Zenodo.\n\nParameters\n----------\nnames : list of str, optional\n    Subset of ``POSTERIOR_REGISTRY`` keys to download.  Downloads all\n    five posteriors when omitted (~158 MB total; the two EIV multivariate\n    posteriors are ~78 MB each — pass ``names=`` to download only the\n    univariate ones if you don't need the EIV model).\ncache_dir : Path or str, optional\n    Destination directory.  Defaults to the standard posterior cache.\nforce : bool\n    Re-download files that already exist locally.\n\nReturns\n-------\nlist of Path\n    Local paths of the downloaded ``.nc`` files.\n\nExamples\n--------\nDownload only the univariate SST posterior (~0.3 MB):\n\n>>> download_posteriors([\"gen_logi_fixed_hier_crtp_univ_priorApprox_SST_scaledRI_cren3\"])","x":"","priv":false,"path":"src/TEXAS/utils/download.py"},"utils.download._case_aliases":{"n":"_case_aliases","m":"utils.download","c":null,"nest":null,"l":215,"e":236,"sig":"_case_aliases() -> dict","doc":"Case-id aliases onto the registry's legacy keys.\n\nTwo names refer to one file and both must work. The **key** is what a user\nasks for, and case ids are canonical from the resubmission on. The\n**filename** is what exists on the published Zenodo record, which is a\nfrozen DOI carrying the legacy long names -- so it cannot change until a\nnew deposit is made, and inventing a case-named URL now would 404.\n\nBuilt rather than hand-listed so it cannot fall out of step with the\nregistry, and failures are silent because an alias is a convenience: a\nposterior this naming scheme cannot classify simply keeps its legacy key.","x":"","priv":true,"path":"src/TEXAS/utils/download.py"},"utils.download._case_id_for":{"n":"_case_id_for","m":"utils.download","c":null,"nest":null,"l":239,"e":254,"sig":"_case_id_for(legacy_key: str) -> str","doc":"Derive a case id from a legacy registry key, by re-reading its parts.","x":"","priv":true,"path":"src/TEXAS/utils/download.py"},"utils.download._local_dest":{"n":"_local_dest","m":"utils.download","c":null,"nest":null,"l":257,"e":275,"sig":"_local_dest(dest_dir: Path, name: str) -> Path","doc":"Where a Zenodo posterior lands locally.\n\nThe Zenodo record is a **flat** namespace -- it has to be, a DOI deposit has\nno subdirectories -- but the local cache is organised by case directory. So\na registry key that is a case id is unpacked into ``<case>/<case>.fwd.nc``,\ngiving one uniform local layout no matter whether a posterior was sampled\nhere or downloaded. Legacy long-name keys stay flat, which is what the\ncurrently published record 10.5281/zenodo.20032542 uses.","x":"","priv":true,"path":"src/TEXAS/utils/download.py"},"utils.download.download_training_data":{"n":"download_training_data","m":"utils.download","c":null,"nest":null,"l":278,"e":324,"sig":"download_training_data(dest_dir: Optional[Path | str], force: bool) -> List[Path]","doc":"Download GDGT training data files from Zenodo.\n\nDownloads the coretop/culture/mesocosm training CSVs and the CMEMS\nNO₃ uncertainty field used in the EIV calibration.  These are needed\nonly to re-run the SI preprocessing and calibration notebooks from\nscratch; they are NOT required for inverse temperature reconstructions —\nuse :func:`download_posteriors` for that.\n\nParameters\n----------\ndest_dir : Path or str, optional\n    Destination directory.  Defaults to ``data/spreadsheets/`` in the\n    repo (or ``~/.texas/data/spreadsheets/`` when pip-installed).\nforce : bool\n    Re-download files that already exist locally.\n\nReturns\n-------\nlist of Path\n    Local paths of the downloaded files.","x":"","priv":false,"path":"src/TEXAS/utils/download.py"},"utils.install._compiler_present":{"n":"_compiler_present","m":"utils.install","c":null,"nest":null,"l":33,"e":39,"sig":"_compiler_present() -> bool","doc":"True if a C++ compiler + make are already on PATH (Windows check).","x":"","priv":true,"path":"src/TEXAS/utils/install.py"},"utils.install._existing_target_is_broken":{"n":"_existing_target_is_broken","m":"utils.install","c":null,"nest":null,"l":42,"e":54,"sig":"_existing_target_is_broken(version: str) -> bool","doc":"True if ``~/.cmdstan/cmdstan-<version>`` exists but is not a usable install.\n\nThis is the state ``cmdstanpy.install_cmdstan()`` will not overwrite on its\nown — the directory is present so it assumes the job is done, but TEXAS's\n``find_cmdstan`` rejects it because ``bin/stanc`` is missing/unusable.","x":"","priv":true,"path":"src/TEXAS/utils/install.py"},"utils.install.install_cmdstan":{"n":"install_cmdstan","m":"utils.install","c":null,"nest":null,"l":57,"e":162,"sig":"install_cmdstan(version: str, *, overwrite: bool, verbose: bool, **kwargs) -> Path | None","doc":"Install CmdStan and point TEXAS at it (opt-in; never runs automatically).\n\nA thin, TEXAS-aware wrapper over :func:`cmdstanpy.install_cmdstan`. On\nWindows, cmdstanpy also installs the RTools C++ toolchain as part of this\ncall, so no separate compiler step is needed.\n\nArgs:\n    version: CmdStan version to install. Defaults to the version TEXAS is\n        tested against (:data:`~TEXAS.constants.RECOMMENDED_CMDSTAN_VERSION`).\n    overwrite: Force reinstall even if the target directory already exists.\n        Auto-enabled when the target exists but is a broken/partial install.\n    verbose: Print a summary and the :func:`~TEXAS.doctor` report afterwards.\n    **kwargs: Forwarded to :func:`cmdstanpy.install_cmdstan` (e.g. ``cores``,\n        ``progress``, ``dir``).\n\nReturns:\n    Path to the resolved CmdStan installation, or ``None`` if the install\n    ran but the toolchain still does not resolve (see the printed report).\n\nRaises:\n    ImportError: if cmdstanpy is not installed.","x":"","priv":false,"path":"src/TEXAS/utils/install.py"},"utils.install.install_cmdstan._log":{"n":"_log","m":"utils.install","c":null,"nest":"install_cmdstan","l":94,"e":96,"sig":"_log(msg: str) -> None","doc":"","x":"","priv":true,"path":"src/TEXAS/utils/install.py"},"utils.install._cli_main":{"n":"_cli_main","m":"utils.install","c":null,"nest":null,"l":165,"e":189,"sig":"_cli_main(argv: list[str] | None) -> int","doc":"Console-script entry point (``texas-install-cmdstan``).\n\nReturns 0 if CmdStan resolves after the attempt, 1 otherwise.","x":"","priv":true,"path":"src/TEXAS/utils/install.py"},"utils.naming.default_version":{"n":"default_version","m":"utils.naming","c":null,"nest":null,"l":217,"e":224,"sig":"default_version() -> str","doc":"``v`` + the package version with separators dropped: 0.2.6 -> ``v026``.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.encode_compset":{"n":"encode_compset","m":"utils.naming","c":null,"nest":null,"l":231,"e":277,"sig":"encode_compset(stan_model_name: str) -> str","doc":"Collapse a long Stan model name into the four-character compset code.\n\n>>> encode_compset(\"gen_logi_fixed_hier_crtp_multiv_priorApprox_eiv_t0shift\")\n'GHEB'\n>>> encode_compset(\"gen_logi_fixed_hier_crtp_multiv_priorApprox_eiv_boundedT\")  # legacy spelling\n'GHEB'\n>>> encode_compset(\"gen_logi_fixed_hier_crtp_univ_priorApprox\")\n'GHPU'\n>>> encode_compset(\"gen_logi_fixed_culmesocore\")\n'GJDU'","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming._first_code":{"n":"_first_code","m":"utils.naming","c":null,"nest":null,"l":280,"e":284,"sig":"_first_code(text: str, table: Sequence) -> Optional[str]","doc":"","x":"","priv":true,"path":"src/TEXAS/utils/naming.py"},"utils.naming.decode_compset":{"n":"decode_compset","m":"utils.naming","c":null,"nest":null,"l":287,"e":298,"sig":"decode_compset(code: str) -> Dict[str, str]","doc":"Expand a compset code into its four axis labels.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.describe_compset":{"n":"describe_compset","m":"utils.naming","c":null,"nest":null,"l":301,"e":305,"sig":"describe_compset(code: str) -> str","doc":"One-line human-readable expansion, for logs and figure captions.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.encode_predictors":{"n":"encode_predictors","m":"utils.naming","c":null,"nest":null,"l":312,"e":332,"sig":"encode_predictors(use_gdgt23ratio: bool, use_no3: bool, no3_cutoff: Optional[float]) -> str","doc":"``G23`` for the GDGT-2/3 ratio, ``N`` + cutoff x10 for nitrate.\n\n>>> encode_predictors(True, True, 1.0)\n'G23-N10'\n>>> encode_predictors(True, False)\n'G23'\n>>> encode_predictors()\n'none'","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.decode_predictors":{"n":"decode_predictors","m":"utils.naming","c":null,"nest":null,"l":335,"e":348,"sig":"decode_predictors(token: str) -> Dict[str, Any]","doc":"Inverse of :func:`encode_predictors`.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.CaseName.__post_init__":{"n":"__post_init__","m":"utils.naming","c":"CaseName","nest":null,"l":374,"e":377,"sig":"__post_init__(self)","doc":"","x":"","priv":true,"path":"src/TEXAS/utils/naming.py"},"utils.naming.CaseName.__str__":{"n":"__str__","m":"utils.naming","c":"CaseName","nest":null,"l":379,"e":393,"sig":"__str__(self) -> str","doc":"The canonical id: ``tx.GHEB.sst.sri03.G23-N10``.\n\nVersion and run are carried when parsed from an older id, so a\nround-trip is lossless, but neither is synthesised. A CaseName built\nfrom attrs therefore renders short, which is what gets written.","x":"","priv":true,"path":"src/TEXAS/utils/naming.py"},"utils.naming.CaseName.temptype_full":{"n":"temptype_full","m":"utils.naming","c":"CaseName","nest":null,"l":397,"e":398,"sig":"temptype_full(self) -> str","doc":"","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.CaseName.proxy_full":{"n":"proxy_full","m":"utils.naming","c":"CaseName","nest":null,"l":401,"e":402,"sig":"proxy_full(self) -> str","doc":"","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.CaseName.describe":{"n":"describe","m":"utils.naming","c":"CaseName","nest":null,"l":404,"e":421,"sig":"describe(self) -> str","doc":"","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.CaseName.with_variant":{"n":"with_variant","m":"utils.naming","c":"CaseName","nest":null,"l":423,"e":428,"sig":"with_variant(self, structure: str) -> 'CaseName'","doc":"Same case with position 4 swapped -- the additive/T0-shift switch.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.run_from_attrs":{"n":"run_from_attrs","m":"utils.naming","c":null,"nest":null,"l":436,"e":453,"sig":"run_from_attrs(attrs: Dict[str, Any]) -> Optional[str]","doc":"Recover the run/member token from a posterior's ``filename`` attr.\n\n``save_posterior`` stamps the name it wrote onto the dataset, and that name\nkeeps the date suffix even when the file on disk was later renamed without\none. So a posterior saved as ``..._cren3.nc`` can still carry\n``filename = \"..._cren3_041526_eiv.nc\"`` and report run ``041526``.\n\nThis is what makes two refits of one configuration distinguishable after\nthe fact. Without it they both collapse onto run ``001`` and a migration\nwould overwrite one with the other.\n\nReturns ``None`` when the attr is missing or carries no stamp.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.case_from_attrs":{"n":"case_from_attrs","m":"utils.naming","c":null,"nest":null,"l":456,"e":498,"sig":"case_from_attrs(attrs: Dict[str, Any], *, version: Optional[str], run: Optional[str]) -> CaseName","doc":"Build a :class:`CaseName` from a posterior's ``.attrs``.\n\nReads ``stan_model_name``, ``temptype``, ``proxy_name``,\n``use_gdgt23ratio``, ``use_no3`` and ``no3_cutoff`` -- exactly the fields\n``save_posterior`` already relies on.\n\nWhen *run* is omitted the token is recovered from the ``filename`` attr via\n:func:`run_from_attrs`, falling back to ``001``. Pass *run* explicitly to\noverride -- ``save_posterior`` does, because a genuinely new fit should be\nstamped with its own suffix rather than inheriting the one that happened to\nbe sitting in the attrs of a posterior loaded earlier.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.parse_case":{"n":"parse_case","m":"utils.naming","c":null,"nest":null,"l":501,"e":519,"sig":"parse_case(text: str) -> CaseName","doc":"Parse ``tx.v026.GHEB.sst.ri3.G23-N10.001`` back into a :class:`CaseName`.\n\nThe run position may be omitted, in which case it defaults to ``001``.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.is_case_id":{"n":"is_case_id","m":"utils.naming","c":null,"nest":null,"l":522,"e":528,"sig":"is_case_id(text: str) -> bool","doc":"True when *text* looks like a case id (cheap guard for dual-read).","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.fwd_relpath":{"n":"fwd_relpath","m":"utils.naming","c":null,"nest":null,"l":536,"e":558,"sig":"fwd_relpath(case: Union[CaseName, str]) -> Path","doc":"``<case>/<case>.fwd.nc`` -- the forward posterior of a case.\n\nThe case is repeated in the leaf on purpose. CESM names data output for its\ncase (``b.e12.B1850C5CN.f19_g16.iPETM09x.01.pop.h.1901-2000.climo.nc``) and\nreserves bare names for case *control* files that never leave the case\ndirectory. A posterior does leave: it is copied around and, decisively,\npublished to a Zenodo record with a **flat** namespace, where fifteen files\nnamed ``fwd.nc`` cannot coexist. Repeating the case costs nothing -- the\nfull path is the same length either way, only the separator moves.\n\n>>> str(fwd_relpath(\"tx.GHEB.sst.sri03.G23-N10\"))\n'tx.GHEB.sst.sri03.G23-N10.fwd.nc'","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.fwd_leaf_candidates":{"n":"fwd_leaf_candidates","m":"utils.naming","c":null,"nest":null,"l":565,"e":567,"sig":"fwd_leaf_candidates(case: Union[CaseName, str]) -> tuple","doc":"Leaf names to try inside a case dir, current scheme first.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.inv_relpath":{"n":"inv_relpath","m":"utils.naming","c":null,"nest":null,"l":570,"e":617,"sig":"inv_relpath(case: Union[CaseName, str], site: str, *, constraint: str, kind: str, scenario: Union[str, Sequence[str], None], run: Union[int, str, None]) -> Path","doc":"``<case>.inv.<site>.<constraint><kind>[-<scenario>][-<NNN>].nc``\n\nThe case is repeated in the leaf for the same reason as in\n:func:`fwd_relpath` -- a reconstruction that is copied out of its case\ndirectory must still say which calibration it came from.\n\n*scenario* takes a sequence as well as a single string, because the\nproduction caller (``io._generate_filename_base``, via ``filename_tag``)\ngenuinely has more than one tag to spend. Each is slugged separately and\nthey join on hyphens, so a sequence and its pre-joined equivalent give the\nsame leaf.\n\n>>> p = inv_relpath(\"tx.GHEB.sst.sri03.G23-N10\", \"U1482\", scenario=\"mod\")\n>>> p.name\n'tx.GHEB.sst.sri03.G23-N10.inv.U1482.ud-mod.nc'\n>>> inv_relpath(\"tx.GHEB.sst.sri03.G23-N10\", \"U1482\",\n...             scenario=[\"no3\", \"modern\"], run=2).name\n'tx.GHEB.sst.sri03.G23-N10.inv.U1482.ud-no3-modern-002.nc'","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.slug":{"n":"slug","m":"utils.naming","c":null,"nest":null,"l":620,"e":622,"sig":"slug(x: Any) -> str","doc":"Filename-safe token: spaces to hyphens, everything exotic dropped.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.resolve_posterior_path":{"n":"resolve_posterior_path","m":"utils.naming","c":null,"nest":null,"l":629,"e":736,"sig":"resolve_posterior_path(name: str, indir: Union[str, Path]) -> Optional[Path]","doc":"Find a forward posterior under *indir* by either naming scheme.\n\nResolution order, cheapest first:\n\n1. ``indir/<name>.nc``                  -- historical flat layout, exact hit\n2. ``indir/<name>/<name>.fwd.nc``       -- case-directory layout, exact hit\n3. ``indir/<name>/fwd.nc``              -- case dirs written before\n   2026-08-11, when the leaf was a bare ``fwd.nc``\n4. *name* is a case id           -- scan flat ``.nc`` files and match the\n   case computed from each file's attrs\n5. *name* is a legacy long name  -- scan case directories and match either\n   the legacy name computed from each posterior's attrs *or* the original\n   filename it recorded when it was saved\n\nThe second half of step 5 is what keeps **date-stamped** legacy names\nworking after a migration. ``legacy_fwd_name()`` reconstructs the unstamped\nform, so a request for ``..._cren3_041626_eiv`` would never match it -- and\nthat stamped form is exactly what the SI notebooks ask for. The ``filename``\nattr records what the file was actually called, so comparing against it\nresolves every suffixed variant exactly.\n\nSteps 4 and 5 open files, so they run only when the exact lookups miss.\nReturns ``None`` when nothing matches, leaving the caller to raise.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.legacy_fwd_name":{"n":"legacy_fwd_name","m":"utils.naming","c":null,"nest":null,"l":739,"e":757,"sig":"legacy_fwd_name(attrs: Dict[str, Any], filename_suffix: str) -> str","doc":"The historical forward name:\n``{model}_{temptype}[_gdgt23ratio][_no3_{cutoff}][_{proxy}]{suffix}``.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.naming.legacy_invT_name":{"n":"legacy_invT_name","m":"utils.naming","c":null,"nest":null,"l":760,"e":793,"sig":"legacy_invT_name(site: str, stan_model_name: str, temptype: str, *, proxy_name: str, use_gdgt23ratio: bool, use_no3: bool, no3_cutoff: Optional[float], tags: Optional[Union[str, Sequence[str]]]) -> str","doc":"The historical invT name, matching ``io._generate_filename_base``.","x":"","priv":false,"path":"src/TEXAS/utils/naming.py"},"utils.paths.find_cmdstan":{"n":"find_cmdstan","m":"utils.paths","c":null,"nest":null,"l":8,"e":109,"sig":"find_cmdstan(min_version: str) -> Path","doc":"Locate a working CmdStan installation and configure cmdstanpy to use it.\n\nAccepts any CmdStan version >= min_version (default 2.23.0, when\nreduce_sum was introduced).  For well-known directories the highest\ninstalled version is preferred so users are not penalised for upgrading.\n\nSearch order:\n  1. ``CMDSTAN`` env var — set by conda on activation; also honoured when\n     set manually (``export CMDSTAN=/path/to/cmdstan-X.Y.Z``)\n  2. ``CONDA_PREFIX/bin/cmdstan`` — conda/mamba env activated interactively\n  3. ``sys.prefix/bin/cmdstan`` — active Python env (covers Docker/mamba\n     where activation scripts didn't run but PATH was set directly)\n  4. ``/opt/cmdstan/``, ``~/.cmdstan/``, ``/usr/local/cmdstan/`` —\n     highest cmdstan-* version found across all three directories\n  5. Whatever cmdstanpy is already configured to use\n\n``set_cmdstan_path()`` is always called so cmdstanpy's internal state stays\nconsistent with the returned path, regardless of which branch matched.\n\nRaises:\n    RuntimeError: if no working CmdStan installation is found anywhere.","x":"Resolves CmdStan in priority order (CMDSTAN env var, conda prefix, sys.prefix, well-known install roots, cmdstanpy's default) and only accepts a candidate whose bin/stanc actually exists and is executable. Always calls set_cmdstan_path() on the winner so cmdstanpy stays consistent. TEXAS never installs CmdStan implicitly.","priv":false,"path":"src/TEXAS/utils/paths.py"},"utils.paths.find_cmdstan.ok":{"n":"ok","m":"utils.paths","c":null,"nest":"find_cmdstan","l":34,"e":36,"sig":"ok(p: Path) -> bool","doc":"","x":"","priv":false,"path":"src/TEXAS/utils/paths.py"},"utils.paths.find_cmdstan._use":{"n":"_use","m":"utils.paths","c":null,"nest":"find_cmdstan","l":38,"e":40,"sig":"_use(p: Path) -> Path","doc":"","x":"","priv":true,"path":"src/TEXAS/utils/paths.py"},"utils.paths.find_cmdstan._ver_tuple":{"n":"_ver_tuple","m":"utils.paths","c":null,"nest":"find_cmdstan","l":42,"e":47,"sig":"_ver_tuple(p: Path)","doc":"Parse (major, minor, patch) from a cmdstan-X.Y.Z directory name.","x":"","priv":true,"path":"src/TEXAS/utils/paths.py"},"utils.paths.get_repo_root":{"n":"get_repo_root","m":"utils.paths","c":null,"nest":null,"l":111,"e":126,"sig":"get_repo_root(target_dir_name: str) -> Path | None","doc":"","x":"","priv":false,"path":"src/TEXAS/utils/paths.py"},"utils.paths.get_project_root":{"n":"get_project_root","m":"utils.paths","c":null,"nest":null,"l":128,"e": const N = DATA.nodes, EDGES = DATA.edges, PIPES = DATA.pipelines;
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- adjacency (static edges) ---- */
const OUT = new Map(), IN = new Map();
for (const [a, b] of EDGES) {
  if (!OUT.has(a)) OUT.set(a, []); OUT.get(a).push(b);
  if (!IN.has(b)) IN.set(b, []); IN.get(b).push(a);
}
const app = $('#app'), canvas = $('#canvas'), host = $('#host'),
      wires = $('#wires'), wiresTop = $('#wiresTop'), dock = $('#dock'),
      intro = $('#intro'), qInput = $('#q');

let view = 'forward', selected = null, hovered = null, query = '';

/* The pipeline behind the active view, or null for the non-graph views. */
const currentPipe = () => PIPES.find(p => p.id === view) || null;
const dynEdges = () => (currentPipe() || {}).dynamic || [];

/* ---------------- rendering ---------------- */
function chip(q, showMod) {
  const d = N[q];
  if (!d) return '';
  const label = d.c ? `<span class="cls">${esc(d.c)}.</span>${esc(d.n)}`
                    : (d.nest ? `<span class="cls">${esc(d.nest)}.</span>${esc(d.n)}` : esc(d.n));
  return `<button class="chip${d.priv ? ' priv' : ''}${d.x ? ' doc' : ''}" data-q="${esc(q)}"
      aria-pressed="false" title="${esc(d.m)}.${esc(d.n)}">
      <span class="fn">${label}</span>
      ${showMod ? `<span class="mod-l">${esc(d.m)}</span>` : ''}
    </button>`;
}

function renderPipeline(p) {
  intro.innerHTML = `
    <p class="kick">${esc(p.kicker)}</p>
    <h1>${esc(p.title)}</h1>
    <p>${esc(p.blurb)}</p>
    <div class="legend">
      <span style="color:var(--accent)"><i></i>calls</span>
      <span style="color:var(--util)"><i></i>called by</span>
      <span style="color:var(--text-3)"><i class="d"></i>dynamic dispatch</span>
      <span><b style="border-style:dashed"></b>private helper</span>
      <span><b style="background:var(--accent);border-color:var(--accent)"></b>has an explainer</span>
    </div>
    <p class="hint">Hover any function to trace its wires; click to pin it open.</p>`;
  host.innerHTML = p.stages.map((s, i) => `
    <section class="band">
      <div class="band-head">
        <div class="idx">${String(i + 1).padStart(2, '0')}</div>
        <h2>${esc(s.name)}</h2>
        <p class="note">${esc(s.note)}</p>
      </div>
      <div class="band-body">${s.nodes.map(q => chip(q, true)).join('')}</div>
    </section>`).join('');
}

function renderAll() {
  const mods = new Map();
  for (const q in N) {
    const m = N[q].m;
    if (!mods.has(m)) mods.set(m, []);
    mods.get(m).push(q);
  }
  intro.innerHTML = `
    <p class="kick">complete surface</p>
    <h1>Every function in src/TEXAS</h1>
    <p>All ${DATA.stats.functions} functions and methods across ${DATA.stats.modules} modules,

       select any function to draw its callers and callees.</p>
