<title>TEXAS call map</title>

<style>
:root{
  --bg:#EAEFEF; --surface:#FFFFFF; --surface-2:#F4F7F7; --surface-3:#E7EDED;
  --line:#CFD9DA; --line-soft:#E0E7E7;
  --text:#16262B; --text-2:#566A71; --text-3:#82949A;
  --fwd:#A5661F; --fwd-ink:#8A5416; --fwd-wash:rgba(165,102,31,.09);
  --inv:#0E6E7D; --inv-ink:#0B5B67; --inv-wash:rgba(14,110,125,.09);
  --util:#5E7480; --util-wash:rgba(94,116,128,.09);
  --warn:#A03A28; --warn-wash:rgba(160,58,40,.09);
  --dim:.28;
  --shadow:0 1px 2px rgba(16,38,44,.05), 0 8px 24px -12px rgba(16,38,44,.18);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --dock-w:390px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B1518; --surface:#111E22; --surface-2:#16262B; --surface-3:#1B2F35;
    --line:#26383E; --line-soft:#1D2E33;
    --text:#E2EAEA; --text-2:#9DB0B5; --text-3:#6F8087;
    --fwd:#DDA35A; --fwd-ink:#EDBE81; --fwd-wash:rgba(221,163,90,.12);
    --inv:#5FC0CF; --inv-ink:#8AD4DF; --inv-wash:rgba(95,192,207,.12);
    --util:#8BA2AC; --util-wash:rgba(139,162,172,.12);
    --warn:#E89078; --warn-wash:rgba(232,144,120,.12);
    --dim:.22;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1518; --surface:#111E22; --surface-2:#16262B; --surface-3:#1B2F35;
  --line:#26383E; --line-soft:#1D2E33;
  --text:#E2EAEA; --text-2:#9DB0B5; --text-3:#6F8087;
  --fwd:#DDA35A; --fwd-ink:#EDBE81; --fwd-wash:rgba(221,163,90,.12);
  --inv:#5FC0CF; --inv-ink:#8AD4DF; --inv-wash:rgba(95,192,207,.12);
  --util:#8BA2AC; --util-wash:rgba(139,162,172,.12);
  --warn:#E89078; --warn-wash:rgba(232,144,120,.12);
  --dim:.22;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px -14px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#EAEFEF; --surface:#FFFFFF; --surface-2:#F4F7F7; --surface-3:#E7EDED;
  --line:#CFD9DA; --line-soft:#E0E7E7;
  --text:#16262B; --text-2:#566A71; --text-3:#82949A;
  --fwd:#A5661F; --fwd-ink:#8A5416; --fwd-wash:rgba(165,102,31,.09);
  --inv:#0E6E7D; --inv-ink:#0B5B67; --inv-wash:rgba(14,110,125,.09);
  --util:#5E7480; --util-wash:rgba(94,116,128,.09);
  --warn:#A03A28; --warn-wash:rgba(160,58,40,.09);
  --dim:.28;
  --shadow:0 1px 2px rgba(16,38,44,.05), 0 8px 24px -12px rgba(16,38,44,.18);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--accent,var(--inv))}
:focus-visible{outline:2px solid var(--accent,var(--inv));outline-offset:2px;border-radius:3px}

/* accent switches with the active view */
.app{--accent:var(--util);--accent-wash:var(--util-wash)}
.app[data-view="forward"]{--accent:var(--fwd);--accent-wash:var(--fwd-wash)}
.app[data-view="inverse"]{--accent:var(--inv);--accent-wash:var(--inv-wash)}
.app[data-view="loose"]{--accent:var(--warn);--accent-wash:var(--warn-wash)}

/* ── header ─────────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:12px 20px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand .mark{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.14em;
  color:var(--accent);transition:color .25s}
.brand .sub{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--text-2)}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:3px}
.tab{padding:5px 13px;border-radius:6px;font-size:13.5px;color:var(--text-2);
  display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5}
.tab[data-t="forward"]{--tc:var(--fwd)} .tab[data-t="inverse"]{--tc:var(--inv)}
.tab[data-t="all"]{--tc:var(--util)} .tab[data-t="loose"]{--tc:var(--warn)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);
  box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.tab[aria-selected="true"] .dot{background:var(--tc);opacity:1}
.tab:hover{color:var(--text)}
.tools{display:flex;align-items:center;gap:10px}
.search{position:relative;display:flex;align-items:center}
.search input{font-family:var(--mono);font-size:13px;width:210px;padding:6px 10px 6px 28px;
  color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px}
.search input::placeholder{color:var(--text-3);font-family:var(--sans)}
.search svg{position:absolute;left:8px;width:14px;height:14px;color:var(--text-3);pointer-events:none}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--text-2)}
.icon-btn:hover{color:var(--text);border-color:var(--accent)}

/* ── shell ──────────────────────────────────────────────── */
main{display:grid;grid-template-columns:minmax(0,1fr) var(--dock-w);align-items:start}
.canvas{position:relative;padding:26px 24px 120px;min-width:0}
.wires{position:absolute;top:0;left:0;pointer-events:none;z-index:0;overflow:visible}
/* active wires sit above the chips so an arrowhead is never hidden behind one */
.wires.hot{z-index:5}
.intro{position:relative;z-index:1;max-width:70ch;margin-bottom:26px}
.intro h1{font-family:var(--serif);font-size:clamp(24px,3.2vw,34px);line-height:1.15;
  letter-spacing:-.01em;margin-bottom:6px}
.intro .kick{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px}
.intro p{color:var(--text-2);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:12.5px;color:var(--text-3)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:22px;height:0;border-top:2px solid currentColor;display:inline-block}
.legend i.d{border-top-style:dashed}
.legend b{width:9px;height:9px;border-radius:2.5px;border:1px solid var(--line);
  background:var(--surface-2);display:inline-block}
.intro .hint{margin:10px 0 0;font-size:12.5px;color:var(--text-3);font-style:italic}

/* ── stage bands ────────────────────────────────────────── */
.band{position:relative;z-index:1;display:grid;grid-template-columns:184px minmax(0,1fr);
  gap:24px;padding:20px 0;border-top:1px solid var(--line-soft)}
.band:first-of-type{border-top:none}
.band-head{position:sticky;top:78px;align-self:start}
.band-head .idx{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.1em}
.band-head h2{font-family:var(--serif);font-size:17px;line-height:1.25;margin:2px 0 6px}
.band-head .note{font-size:12.5px;color:var(--text-3);line-height:1.45;margin:0}
.band-body{display:flex;flex-wrap:wrap;gap:10px;align-content:start;padding-top:2px}

/* ── module cards (full graph) ──────────────────────────── */
.mods{position:relative;z-index:1;display:grid;gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 13px 14px}
.mod h3{font-family:var(--mono);font-size:12.5px;color:var(--text-2);margin-bottom:2px;
  word-break:break-all}
.mod h3 em{font-style:normal;color:var(--text);font-weight:600}
.mod .cnt{font-size:11px;color:var(--text-3);margin-bottom:10px;font-variant-numeric:tabular-nums}
.mod .band-body{gap:7px}

/* ── loose ends ─────────────────────────────────────────── */
.le{position:relative;z-index:1;max-width:104ch}
.le-group{margin-bottom:34px}
.le-group > h2{font-family:var(--serif);font-size:19px;margin-bottom:4px}
.le-group > p{color:var(--text-2);font-size:13.5px;margin:0 0 14px;max-width:78ch}
.le-list{display:grid;gap:9px}
.le-row{display:grid;grid-template-columns:4px minmax(0,1fr);gap:0;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;width:100%}
.le-row:hover{border-color:var(--accent)}
.le-row .stripe{background:var(--accent);opacity:.85}
.le-row.soft .stripe{background:var(--util);opacity:.5}
.le-row .body{padding:11px 14px 12px;min-width:0}
.le-row .hdr{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 10px}
.le-row .fnq{font-family:var(--mono);font-size:13.5px;font-weight:600;word-break:break-word}
.le-row .fnq .cls{color:var(--text-3);font-weight:400}
.le-row .where{font-family:var(--mono);font-size:10.5px;color:var(--text-3);
  font-variant-numeric:tabular-nums}
.le-row .why{display:block;font-size:13.5px;color:var(--text-2);line-height:1.55;margin:6px 0 0;max-width:76ch}
.le-row .pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;background:var(--surface-3);color:var(--text-2)}
.pill.w{background:var(--warn-wash);color:var(--warn)}
.le-note{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;
  background:var(--surface);padding:12px 15px;margin-bottom:24px;font-size:13.5px;
  color:var(--text-2);max-width:80ch}
.le-note strong{color:var(--text)}
.le-cols{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

/* ── chips ──────────────────────────────────────────────── */
.chip{position:relative;z-index:1;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:7px 11px 8px;
  box-shadow:var(--shadow);transition:border-color .15s,transform .15s,opacity .2s,background .15s;
  max-width:100%}
.chip .fn{font-family:var(--mono);font-size:13px;line-height:1.3;color:var(--text);
  display:block;word-break:break-word}
.chip .fn .cls{color:var(--text-3)}
.chip .mod-l{font-size:10.5px;color:var(--text-3);font-family:var(--mono);letter-spacing:.01em;
  display:block;margin-top:2px}
.chip.priv .fn{color:var(--text-2)}
.chip.priv{border-style:dashed}
.chip.doc::after{content:"";position:absolute;top:7px;right:7px;width:5px;height:5px;
  border-radius:50%;background:var(--accent);opacity:.7}
.chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);
  box-shadow:0 0 0 1px var(--accent), var(--shadow)}
.chip.rel-out{border-color:var(--accent)}
.chip.rel-in{border-color:var(--util)}
.canvas.focused .chip:not(.rel-out):not(.rel-in):not([aria-pressed="true"]){opacity:var(--dim)}
.chip.miss{opacity:.14}
.le-row.miss{display:none}
.canvas.searching .chip.hit{border-color:var(--accent);background:var(--accent-wash)}
.mod.allmiss{display:none}

/* ── dock ───────────────────────────────────────────────── */
.dock{position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;
  border-left:1px solid var(--line);background:var(--surface);padding:22px 22px 60px}
.dock .empty{color:var(--text-3);font-size:13.5px}
.dock .empty h3{font-family:var(--serif);font-size:16px;color:var(--text);margin-bottom:8px}
.dock .empty ul{margin:10px 0 0;padding-left:17px;display:grid;gap:6px}
.d-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:9px}
.d-name{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1.25;
  word-break:break-word;margin-bottom:3px}
.d-name .cls{color:var(--text-3);font-weight:400}
.d-loc{font-family:var(--mono);font-size:11.5px;color:var(--text-3);
  font-variant-numeric:tabular-nums;word-break:break-all}
.d-tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tag{font-size:10.5px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;background:var(--surface-3);color:var(--text-2)}
.tag.acc{background:var(--accent-wash);color:var(--accent)}
.tag.warn{background:var(--warn-wash);color:var(--warn)}
.expl.reach{font-size:13.5px;color:var(--text-2)}
.expl code{font-family:var(--mono);font-size:12px;background:var(--surface-2);
  padding:1px 5px;border-radius:4px;color:var(--text)}
.d-sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft)}
.d-sec h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-3);font-weight:600;margin-bottom:9px;display:flex;gap:8px;align-items:center}
.d-sec h4 .n{font-family:var(--sans);letter-spacing:0;text-transform:none;
  color:var(--text-3);font-weight:400;font-variant-numeric:tabular-nums}
.sig{font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:8px;padding:10px 11px;
  overflow-x:auto;white-space:pre;color:var(--text-2)}
.sig b{color:var(--text);font-weight:600}
.expl{font-size:14px;line-height:1.62;color:var(--text)}
.docstr{font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--text-2);
  white-space:pre-wrap;overflow-x:auto;margin:0;
  max-height:270px;overflow-y:auto}
.reflist{display:grid;gap:5px}
.ref{display:flex;align-items:baseline;gap:8px;text-align:left;padding:5px 8px;border-radius:7px;
  border:1px solid transparent;width:100%}
.ref:hover{background:var(--surface-2);border-color:var(--line)}
.ref .arrow{font-family:var(--mono);font-size:11px;color:var(--accent);flex:none}
.ref.in .arrow{color:var(--util)}
.ref .t{min-width:0}
.ref .t b{font-family:var(--mono);font-size:12.5px;font-weight:500;display:block;
  word-break:break-word}
.ref .t span{font-family:var(--mono);font-size:10.5px;color:var(--text-3);display:block}
.ref .dyn{font-size:10px;color:var(--text-3);font-style:italic}
.none{font-size:12.5px;color:var(--text-3);font-style:italic}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:1080px){
  main{grid-template-columns:minmax(0,1fr)}
  .dock{position:fixed;left:0;right:0;bottom:0;top:auto;height:min(58vh,520px);z-index:40;
    border-left:none;border-top:1px solid var(--line);border-radius:14px 14px 0 0;
    box-shadow:0 -12px 40px -16px rgba(0,0,0,.35);transform:translateY(calc(100% - 0px));
    transition:transform .28s}
  .dock.open{transform:translateY(0)}
  .dock:not(.open){display:none}
  .band{grid-template-columns:minmax(0,1fr);gap:12px}
  .band-head{position:static}
  .canvas{padding-bottom:60vh}
}
@media (max-width:560px){
  .top{padding:10px 14px;gap:10px}
  .brand .sub{display:none}
  .search input{width:140px}
  .canvas{padding-left:14px;padding-right:14px}
}
</style>

<div class="app" id="app" data-view="forward">
  <header class="top">
    <div class="brand">
      <span class="mark">TEXAS</span>
      <span class="sub">call map</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="View">
      <button class="tab" role="tab" data-t="forward" aria-selected="true"><i class="dot"></i>Forward calibration</button>
      <button class="tab" role="tab" data-t="inverse" aria-selected="false"><i class="dot"></i>Inverse prediction</button>
      <button class="tab" role="tab" data-t="all" aria-selected="false"><i class="dot"></i>Every function</button>
      <button class="tab" role="tab" data-t="loose" aria-selected="false"><i class="dot"></i>Loose ends</button>
    </nav>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>
        </svg>
        <input id="q" type="search" placeholder="Find a function" aria-label="Find a function"/>
      </label>
      <button class="icon-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5Z"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div class="canvas" id="canvas">
      <svg class="wires" id="wires" aria-hidden="true"></svg>
      <svg class="wires hot" id="wiresTop" aria-hidden="true"></svg>
      <div class="intro" id="intro"></div>
      <div id="host"></div>
    </div>
    <aside class="dock" id="dock" aria-live="polite"></aside>
  </main>
</div>

<script>
const DATA = {"nodes":{"data.builder._fwd_case_id":{"n":"_fwd_case_id","m":"data.builder","c":null,"nest":null,"l":22,"e":32,"sig":"_fwd_case_id(attrs: Dict[str, Any]) -> str","doc":"Case id of the forward posterior, or \"\" if it cannot be derived.\n\nNever fatal: naming is a convenience layer, and a calibration that predates\nit (or carries incomplete attrs) must still be usable for reconstruction.","x":"","priv":true,"path":"src/TEXAS/data/builder.py"},"data.builder.build_invT_inputData":{"n":"build_invT_inputData","m":"data.builder","c":null,"nest":null,"l":61,"e":400,"sig":"build_invT_inputData(proxyObs: Union[np.ndarray, List[float]], prior_mu_t: Union[np.ndarray, float], prior_sigma_t: float, *, scaledRI: Union[np.ndarray, List[float]], fwd_posterior_name: Optional[str], predictors: Optional[Dict[str, np.ndarray]], config: Optional[InvTConfig], fwd_posterior: Optional[xr.Dataset], fwd_cache_dir: Optional[Union[str, Path]]) -> Tuple[Dict[str, Any], Dict[str, Any]]","doc":"Build the `data` dictionary for Stan's inverse model and sampler configuration.\n\nWORKFLOW:\n─────────\n1. Load forward calibration posterior from .nc file (or accept a pre-loaded Dataset)\n2. Randomly sample M parameter sets from that posterior\n3. Extract calibration curve parameters (t0, k, b, v, sigma)\n4. Package optional environmental predictors (GDGT-2/3, NO3) if used\n5. Return data dict (for Stan) + sampler_kwargs (for CmdStanPy)\n\nArgs:\n    proxyObs: Observed proxy values to predict temperature from (length N).\n        Any proxy is accepted: scaledRI, TEX86, ringIndex, etc.\n    prior_mu_t: Prior mean temperature (scalar or array of length N)\n    prior_sigma_t: Prior temperature uncertainty (e.g., 10°C)\n    fwd_posterior_name: Name of saved forward calibration (without .nc extension).\n        Not required when fwd_posterior is supplied directly.\n    predictors: Optional environmental covariates {'gdgt23ratio': array, 'no3': array}\n    config: Configuration object controlling M, seed, etc.\n    fwd_posterior: Pre-loaded forward posterior xr.Dataset. When provided,\n        fwd_posterior_name is ignored and no file I/O is performed. Useful\n        when running from Google Colab or any pip-install context where the\n        posterior cache is not available.\n    fwd_cache_dir: Directory to resolve fwd_posterior_name in. Defaults to\n…","x":"The bridge between the two stages. It loads (or accepts) the forward posterior, randomly samples M parameter sets from it, extracts t0/k/b/v/sigma, packages any optional predictors, and returns both the Stan data dict and the sampler kwargs. Sampling M whole parameter sets rather than M independent marginals is what keeps posterior correlations intact.","priv":false,"path":"src/TEXAS/data/builder.py"},"data.builder._fit_gen_logi_to_get_residuals":{"n":"_fit_gen_logi_to_get_residuals","m":"data.builder","c":null,"nest":null,"l":410,"e":435,"sig":"_fit_gen_logi_to_get_residuals(t: np.ndarray, proxy: np.ndarray) -> np.ndarray","doc":"Fit generalized logistic (fixed upper asymptote = 1) to (t, proxy) and\nreturn residuals (proxy − predicted). Used internally to compute the\ntemperature-only baseline before finding the optimal NO3 threshold.","x":"Least-squares fit of a thermal-only generalized logistic, used purely to produce residuals for the NO3 cutoff search. Not a Bayesian fit and never used for calibration itself.","priv":true,"path":"src/TEXAS/data/builder.py"},"data.builder._fit_gen_logi_to_get_residuals._model":{"n":"_model","m":"data.builder","c":null,"nest":"_fit_gen_logi_to_get_residuals","l":419,"e":420,"sig":"_model(x, t0, b, k, v)","doc":"","x":"","priv":true,"path":"src/TEXAS/data/builder.py"},"data.builder._auto_no3_cutoff":{"n":"_auto_no3_cutoff","m":"data.builder","c":null,"nest":null,"l":438,"e":477,"sig":"_auto_no3_cutoff(no3: np.ndarray, t_crtp: np.ndarray, proxy_crtp: np.ndarray, proxy_residuals: Optional[np.ndarray]) -> float","doc":"Auto-calculate no3_cutoff via find_optimal_no3_threshold (Spearman method).\nNaN rows are dropped across all arrays before scoring.","x":"Finds the nitrate threshold below which the NO3 correction should apply, by fitting a thermal-only generalized logistic, taking residuals, and scanning cutoffs for the strongest Spearman rank correlation between residual and NO3. NaN rows are dropped across all arrays before scoring. Only runs when no3_cutoff is not supplied.","priv":true,"path":"src/TEXAS/data/builder.py"},"data.builder._extract_culmeso_hyperpriors":{"n":"_extract_culmeso_hyperpriors","m":"data.builder","c":null,"nest":null,"l":480,"e":514,"sig":"_extract_culmeso_hyperpriors(posterior: xr.Dataset) -> Dict[str, Any]","doc":"Extract prior_mean_* / prior_sd_* hyperpriors from a culmeso forward posterior.\nReturns a dict with those keys plus '_suffix' and '_n_draws' for logging.","x":"Pulls raw mean and standard deviation for t0, k, b and v out of a culture+mesocosm posterior. These become the informative priors in the second-stage priorApprox coretop model, which is how the hierarchy is approximated without refitting stage one.","priv":true,"path":"src/TEXAS/data/builder.py"},"data.builder.build_fwd_data":{"n":"build_fwd_data","m":"data.builder","c":null,"nest":null,"l":517,"e":850,"sig":"build_fwd_data(*, t_cul, proxy_cul, t_meso, proxy_meso, t_crtp, proxy_crtp, gdgt23ratio_crtp, sd_gdgt23ratio_crtp, no3_crtp, sd_no3_crtp, no3_cutoff: Optional[float], proxy_residuals_crtp: Optional[np.ndarray], sd_proxyObs, R2_thermal: Optional[float], culmeso_posterior: Optional[xr.Dataset], prior_mean_t0, prior_sd_t0, prior_mean_k, prior_sd_k, prior_mean_b, prior_sd_b, prior_mean_v, prior_sd_v) -> Dict[str, Any]","doc":"Build the Stan data dictionary for forward calibration models.\n\nHandles all forward model variants:\n  - culmeso / Q1_culmeso / v1_culmeso  : pass t_cul, proxy_cul, t_meso, proxy_meso\n  - culmesocore                         : add t_crtp, proxy_crtp\n  - hier_crtp_multiv                    : add gdgt23ratio_crtp, no3_crtp\n  - hier_crtp_multiv_priorApprox        : add culmeso_posterior (extracts hyperpriors)\n  - hier_crtp_univ_priorApprox          : add culmeso_posterior (no predictors needed)\n\nArgs:\n    t_cul, proxy_cul:           Culture temperature and proxy arrays.\n    t_meso, proxy_meso:         Mesocosm temperature and proxy arrays.\n    t_crtp, proxy_crtp:         Coretop temperature and proxy arrays.\n    gdgt23ratio_crtp:           GDGT-2/GDGT-3 ratio for coretop samples.\n                                Sets use_gdgt23ratio=1 if non-zero/non-NaN.\n    sd_gdgt23ratio_crtp:        Per-site measurement SE of gdgt23ratio (same units,\n                                linear). Required for the _eiv model; always included\n                                in the data dict (defaults to zeros when not provided,\n                                which disables the G₂/₃ EIV measurement model).\n    no3_crtp:                   Nitrate concentration for coretop samples.\n                                Sets use_no3=1 if non-zero/non-NaN.\n…","x":"The single recommended way to build a forward Stan data dict. It enforces proxyObs_* key naming, validates array shapes, auto-sets use_gdgt23ratio / use_no3 from whether the arrays are present and non-NaN, and auto-computes no3_cutoff when you omit it. For two-stage priorApprox models, pass culmeso_posterior= and it extracts the t0/k/b/v hyperpriors for you. It always emits sd_gdgt23ratio_crtp, sd_no3_crtp and sd_proxyObs (defaulting to zeros / 0.03) so the EIV model can be run without changing the call.","priv":false,"path":"src/TEXAS/data/builder.py"},"data.builder.build_fwd_data._range_str":{"n":"_range_str","m":"data.builder","c":null,"nest":"build_fwd_data","l":632,"e":637,"sig":"_range_str(t_arr, p_arr)","doc":"","x":"","priv":true,"path":"src/TEXAS/data/builder.py"},"data.filter.filter_stan_compatible":{"n":"filter_stan_compatible","m":"data.filter","c":null,"nest":null,"l":5,"e":11,"sig":"filter_stan_compatible(data: Dict[str, Any]) -> Dict[str, Any]","doc":"Return a shallow copy of `data` containing only types compatible with Stan inputs.\nAllowed types: int, float, list, numpy.ndarray.","x":"","priv":false,"path":"src/TEXAS/data/filter.py"},"data.filter.ensure_numpy":{"n":"ensure_numpy","m":"data.filter","c":null,"nest":null,"l":14,"e":23,"sig":"ensure_numpy(x)","doc":"Ensure the input is a numpy.ndarray.\nHandles pandas Series, xarray DataArray (via .values), plain lists, and arrays.","x":"","priv":false,"path":"src/TEXAS/data/filter.py"},"data.ocean_lookup.lookup_no3_from_woa":{"n":"lookup_no3_from_woa","m":"data.ocean_lookup","c":null,"nest":null,"l":22,"e":149,"sig":"lookup_no3_from_woa(lat: Union[float, np.ndarray], lon: Union[float, np.ndarray], woa_dataset: xr.Dataset, variable: str, method: Literal['linear', 'nearest']) -> np.ndarray","doc":"Look up modern NO₃ at one or more lat/lon coordinates from a WOA23-derived\nxarray Dataset.\n\nThe dataset is typically the preprocessed ``ocean_prop_ds`` generated in\nSI_code1, which contains thermocline-depth-integrated WOA23 climatology on\na regular ``(lat, lon)`` grid.  The returned value(s) are time-invariant\n(climatological mean) and intended as a modern-ocean proxy for the NO₃\ncorrection in paleo reconstructions.\n\nParameters\n----------\nlat : float or array-like\n    Latitude(s) in decimal degrees (−90 to 90).  Pass a scalar for a\n    single drill site; pass an array of length N to match N observations.\nlon : float or array-like\n    Longitude(s) in decimal degrees.  Both −180–180 and 0–360 conventions\n    are accepted — the function normalises to match the dataset's convention\n    automatically.\nwoa_dataset : xr.Dataset\n    WOA23-derived dataset with a ``(lat, lon)`` grid containing *variable*.\n    Dimensions must be named ``\"lat\"`` and ``\"lon\"``.\nvariable : str\n    Name of the NO₃ variable to extract.  Default ``\"no3_sf2tc_avg\"``\n    (thermocline depth-integrated annual average from SI_code1).\nmethod : {\"linear\", \"nearest\"}\n    Interpolation method.  ``\"linear\"`` (default) performs bilinear\n    interpolation and is preferred for smooth fields.  ``\"nearest\"`` snaps\n    to the closest grid cell and is useful when the dataset is sparse or\n    has NaN-masked shelves.\n\nReturns\n…","x":"Nearest-valid-cell lookup of modern nitrate from a WOA23-derived dataset given site lat/lon. Lets you run the NO3-corrected model on cores that have no measured nitrate.","priv":false,"path":"src/TEXAS/data/ocean_lookup.py"},"data.screening.MahalanobisOutlierDetector.__init__":{"n":"__init__","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":34,"e":62,"sig":"__init__(self, features: list[str], confidence: float, method: Literal['chi2', 'chi2_rounddown'], use_pinv_if_singular: bool)","doc":"Parameters\n----------\nfeatures : list[str]\n    Feature column names to use for distance calculation\nconfidence : float, default=0.99\n    Confidence level for outlier threshold (0-1)\nmethod : {'chi2', 'chi2_rounddown'}, default='chi2'\n    Method for threshold calculation\nuse_pinv_if_singular : bool, default=True\n    Use pseudo-inverse if covariance matrix is singular","x":"","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.fit":{"n":"fit","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":64,"e":122,"sig":"fit(self, df: pd.DataFrame, *, columns: Optional[dict], on_unscorable: Literal['warn', 'raise', 'ignore']) -> 'MahalanobisOutlierDetector'","doc":"Fit mean, covariance, and threshold on training data.\n\nParameters\n----------\ndf : pd.DataFrame\n    Training data\ncolumns : dict, optional\n    Mapping {logical_name: physical_column} for callers whose\n    DataFrame uses different column names than ``self.features``.\non_unscorable : {'warn', 'raise', 'ignore'}, default 'warn'\n    Policy for rows that map to a present column but are NaN/Inf.\n\nReturns\n-------\nself : MahalanobisOutlierDetector\n    Fitted detector instance","x":"Estimates the mean vector and covariance of the chosen feature set, which defines the Mahalanobis metric everything downstream is measured in.","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector._round_down_to_nearest_5":{"n":"_round_down_to_nearest_5","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":125,"e":127,"sig":"_round_down_to_nearest_5(x: float) -> float","doc":"Round down to nearest 0.05.","x":"","priv":true,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector._resolve_features":{"n":"_resolve_features","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":129,"e":196,"sig":"_resolve_features(self, df: pd.DataFrame, *, columns: Optional[dict], logical: Optional[list], on_unscorable: Literal['warn', 'raise', 'ignore']) -> pd.DataFrame","doc":"Select feature columns from `df` via a logical->physical map and return\na COPY relabeled to the logical names (same index as `df`).\n\nParameters\n----------\ndf : pd.DataFrame\n    Caller data (physical column names).\ncolumns : dict, optional\n    Mapping {logical_name: physical_column}. Missing keys default to\n    identity (logical == physical). None means full identity.\nlogical : list, optional\n    Logical names to resolve. Defaults to ``self.features``.\non_unscorable : {'warn', 'raise', 'ignore'}, default 'warn'\n    Policy for rows that map to a present column but are NaN/Inf and\n    therefore cannot be scored.\n\nRaises\n------\nKeyError\n    If any mapped physical column is absent from `df`, naming each\n    unresolved ``logical -> physical`` pair.\nValueError\n    If `on_unscorable='raise'` and any unscorable rows exist, or if\n    `on_unscorable` is not one of the allowed values.","x":"","priv":true,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector._compute_distances":{"n":"_compute_distances","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":198,"e":237,"sig":"_compute_distances(self, df: pd.DataFrame, *, columns: Optional[dict], on_unscorable: Literal['warn', 'raise', 'ignore']) -> pd.Series","doc":"Internal method to compute Mahalanobis distances.\n\nParameters\n----------\ndf : pd.DataFrame\n    Data to compute distances for\ncolumns : dict, optional\n    Mapping {logical_name: physical_column}.\non_unscorable : {'warn', 'raise', 'ignore'}, default 'warn'\n    Policy for rows that map to a present column but are NaN/Inf.\n\nReturns\n-------\ndistances : pd.Series\n    Mahalanobis distances (NaN for invalid rows)","x":"","priv":true,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.transform":{"n":"transform","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":239,"e":273,"sig":"transform(self, df: pd.DataFrame, col_name: Optional[str], *, columns: Optional[dict], on_unscorable: Literal['warn', 'raise', 'ignore']) -> pd.Series","doc":"Compute Mahalanobis distances using fitted parameters.\n\nParameters\n----------\ndf : pd.DataFrame\n    Data to transform\ncol_name : str, optional\n    If provided, add distances to df as this column\ncolumns : dict, optional\n    Mapping {logical_name: physical_column}.\non_unscorable : {'warn', 'raise', 'ignore'}, default 'warn'\n    Policy for rows that map to a present column but are NaN/Inf.\n\nReturns\n-------\ndistances : pd.Series\n    Mahalanobis distances","x":"","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.detect_outliers":{"n":"detect_outliers","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":275,"e":316,"sig":"detect_outliers(self, df: pd.DataFrame, col_name: Optional[str], *, columns: Optional[dict], on_unscorable: Literal['warn', 'raise', 'ignore']) -> pd.Series","doc":"Detect outliers using fitted threshold.\n\nParameters\n----------\ndf : pd.DataFrame\n    Data to screen\ncol_name : str, optional\n    If provided, add outlier flags to df as this column\ncolumns : dict, optional\n    Mapping {logical_name: physical_column}.\non_unscorable : {'warn', 'raise', 'ignore'}, default 'warn'\n    Policy for rows that map to a present column but are NaN/Inf.\n\nReturns\n-------\noutliers : pd.Series\n    Boolean series (True=outlier, False=inlier, NaN=invalid)","x":"","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.detect_outliers_manual":{"n":"detect_outliers_manual","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":318,"e":387,"sig":"detect_outliers_manual(self, df: pd.DataFrame, col_name: Optional[str], exclude_condition: Optional[pd.Series], *, columns: Optional[dict], on_unscorable: Literal['warn', 'raise', 'ignore']) -> pd.Series","doc":"Detect outliers with manual exception rules.\n\nParameters\n----------\ndf : pd.DataFrame\n    Data to screen\ncol_name : str, optional\n    If provided, add manual outlier flags to df as this column\nexclude_condition : pd.Series, optional\n    Boolean series indicating samples to exclude from outlier detection.\n    If None, applies default: (ringIndex > 3) & (TEX86 > 0.7)\ncolumns : dict, optional\n    Mapping {logical_name: physical_column} for callers whose\n    DataFrame uses different column names than ``self.features``.\non_unscorable : {'warn', 'raise', 'ignore'}, default 'warn'\n    Policy for rows that map to a present column but are NaN/Inf.\n\nReturns\n-------\nmanual_outliers : pd.Series\n    Boolean series with manual exceptions applied\n\nExamples\n--------\n>>> # Use default exception\n>>> outliers = detector.detect_outliers_manual(df)\n>>>\n>>> # Custom exception\n>>> custom_exclude = (df['SST'] > 30) & (df['TEX86'] > 0.8)\n>>> outliers = detector.detect_outliers_manual(df, exclude_condition=custom_exclude)","x":"The screening actually used to build the finalized global compilation. Unlike detect_outliers(), which thresholds on Mahalanobis distance alone, this applies explicit per-variable bounds so domain knowledge (e.g. plausible SST or RI ranges) can override the purely statistical call.","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.detect_outliers_manual._col":{"n":"_col","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":365,"e":366,"sig":"_col(name)","doc":"","x":"","priv":true,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector._get_exception_bounds":{"n":"_get_exception_bounds","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":389,"e":405,"sig":"_get_exception_bounds(self) -> Optional[dict]","doc":"Return {feature_name: threshold} for the default manual exception, or None.\nMirrors the branching logic in detect_outliers_manual().","x":"","priv":true,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.fit_transform":{"n":"fit_transform","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":407,"e":457,"sig":"fit_transform(self, df: pd.DataFrame, dist_col: Optional[str], outlier_col: Optional[str], manual_outlier_col: Optional[str], *, columns: Optional[dict], on_unscorable: Literal['warn', 'raise', 'ignore']) -> dict","doc":"Fit and transform in one step.\n\nParameters\n----------\ndf : pd.DataFrame\n    Training data\ndist_col : str, optional\n    Column name for distances\noutlier_col : str, optional\n    Column name for outlier flags\nmanual_outlier_col : str, optional\n    Column name for manual outlier flags\ncolumns : dict, optional\n    Mapping {logical_name: physical_column}.\non_unscorable : {'warn', 'raise', 'ignore'}, default 'warn'\n    Policy for rows that map to a present column but are NaN/Inf.\n\nReturns\n-------\nresults : dict\n    Dictionary containing:\n    - 'distances': Mahalanobis distances\n    - 'outliers': Outlier flags\n    - 'manual_outliers': Manual outlier flags\n    - 'threshold': Computed threshold","x":"Fit, score and screen in one call. Convenient, but note that the manuscript notebooks do not use it: they call fit() and then detect_outliers_manual() so the per-variable bounds can be set explicitly.","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.get_params":{"n":"get_params","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":459,"e":478,"sig":"get_params(self) -> dict","doc":"Get fitted parameters.\n\nReturns\n-------\nparams : dict\n    Dictionary of fitted parameters","x":"","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.__repr__":{"n":"__repr__","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":480,"e":483,"sig":"__repr__(self)","doc":"","x":"","priv":true,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.get_confidence_ellipse_params":{"n":"get_confidence_ellipse_params","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":486,"e":534,"sig":"get_confidence_ellipse_params(self, n_std: float) -> dict","doc":"Get parameters for drawing confidence ellipse (2D only).\n\nParameters\n----------\nn_std : float, optional\n    Number of standard deviations for ellipse.\n    If None, uses fitted threshold.\n    \nReturns\n-------\nparams : dict\n    Dictionary with 'center', 'width', 'height', 'angle'\n    \nRaises\n------\nValueError\n    If detector is not fitted or has != 2 features","x":"","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.plot_ellipse":{"n":"plot_ellipse","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":536,"e":590,"sig":"plot_ellipse(self, ax: plt.Axes, n_std: float, **kwargs) -> Ellipse","doc":"Plot confidence ellipse on matplotlib axes (2D only).\n\nParameters\n----------\nax : matplotlib.axes.Axes, optional\n    Axes to plot on. If None, uses current axes.\nn_std : float, optional\n    Number of standard deviations. If None, uses fitted threshold.\n**kwargs\n    Additional arguments passed to matplotlib.patches.Ellipse\n    \nReturns\n-------\nellipse : matplotlib.patches.Ellipse\n    The ellipse patch object\n    \nExamples\n--------\n>>> fig, ax = plt.subplots()\n>>> ax.scatter(df['TEX86'], df['ringIndex'])\n>>> detector.plot_ellipse(ax, facecolor='none', edgecolor='red', linewidth=2)","x":"","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.plot_decision_boundary":{"n":"plot_decision_boundary","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":592,"e":713,"sig":"plot_decision_boundary(self, df: pd.DataFrame, ax: plt.Axes, plot_data: bool, show_outliers: bool, use_manual: bool, show_exception_region: bool, ellipse_kwargs: dict, scatter_kwargs: dict, outlier_kwargs: dict) -> tuple","doc":"Complete visualization with data points and decision boundary.\n\nParameters\n----------\ndf : pd.DataFrame\n    Data to visualize\nax : matplotlib.axes.Axes, optional\n    Axes to plot on\nplot_data : bool, default=True\n    Whether to plot data points\nshow_outliers : bool, default=True\n    Whether to highlight outliers differently\nuse_manual : bool, default=True\n    If True, use detect_outliers_manual() so that points kept by the\n    manual exception (e.g. high TEX86 + high scaledRI) are shown as\n    inliers, matching the actual filtered dataset. If False, use\n    detect_outliers() (pure distance threshold, ignores the exception).\nshow_exception_region : bool, default=True\n    If True and use_manual is True, draw a shaded rectangle marking\n    the high-RI / high-TEX86 corner that is retained regardless of\n    Mahalanobis distance. Has no effect when use_manual=False or when\n    the feature combination has no default exception.\nellipse_kwargs : dict, optional\n    Keyword arguments for ellipse\nscatter_kwargs : dict, optional\n    Keyword arguments for inlier scatter plot\noutlier_kwargs : dict, optional\n    Keyword arguments for outlier scatter plot\n\nReturns\n-------\nax : matplotlib.axes.Axes\n    The axes object\nellipse : matplotlib.patches.Ellipse\n    The ellipse patch\n\nExamples\n--------\n>>> detector = MahalanobisOutlierDetector(['TEX86', 'ringIndex'])\n>>> detector.fit(df)\n…","x":"","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.plot_multiple_ellipses":{"n":"plot_multiple_ellipses","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":715,"e":779,"sig":"plot_multiple_ellipses(self, df: pd.DataFrame, ax: plt.Axes, n_std_levels: list, colors: list, **kwargs)","doc":"Plot multiple confidence ellipses at different threshold levels.\n\nParameters\n----------\ndf : pd.DataFrame\n    Data to visualize\nax : matplotlib.axes.Axes, optional\n    Axes to plot on\nn_std_levels : list, optional\n    List of standard deviation levels. Default: [1, 2, 3, threshold]\ncolors : list, optional\n    Colors for each ellipse level\n**kwargs\n    Additional arguments passed to scatter plot\n    \nExamples\n--------\n>>> detector.plot_multiple_ellipses(df, n_std_levels=[1, 2, 2.5, 3])","x":"","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.plot_pairwise_ellipses":{"n":"plot_pairwise_ellipses","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":781,"e":892,"sig":"plot_pairwise_ellipses(self, df: pd.DataFrame, figsize: tuple, show_outliers: bool, ellipse_kwargs: dict, scatter_kwargs: dict, outlier_kwargs: dict)","doc":"Plot pairwise 2D projections with confidence ellipses for high-dimensional data.\n\nParameters\n----------\ndf : pd.DataFrame\n    Data to visualize\nfigsize : tuple, optional\n    Figure size. Auto-calculated if None.\nshow_outliers : bool, default=True\n    Whether to highlight outliers\nellipse_kwargs : dict, optional\n    Keyword arguments for ellipses\nscatter_kwargs : dict, optional\n    Keyword arguments for inlier scatter\noutlier_kwargs : dict, optional\n    Keyword arguments for outlier scatter\n    \nReturns\n-------\nfig : matplotlib.figure.Figure\n    Figure object\naxs : array of matplotlib.axes.Axes\n    Array of axes objects\n    \nExamples\n--------\n>>> detector = MahalanobisOutlierDetector(['TEX86', 'ringIndex', 'fGDGT_0', 'fGDGT_cren'])\n>>> detector.fit(coretop_df)\n>>> fig, axs = detector.plot_pairwise_ellipses(coretop_df)","x":"","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.plot_pca_projection":{"n":"plot_pca_projection","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":894,"e":1030,"sig":"plot_pca_projection(self, df: pd.DataFrame, n_components: int, ax: plt.Axes, show_outliers: bool, show_variance: bool, ellipse_kwargs: dict, scatter_kwargs: dict, outlier_kwargs: dict)","doc":"Project high-dimensional data to 2D/3D using PCA and plot with ellipse.\n\nParameters\n----------\ndf : pd.DataFrame\n    Data to visualize\nn_components : int, default=2\n    Number of PCA components (2 or 3)\nax : matplotlib.axes.Axes, optional\n    Axes to plot on\nshow_outliers : bool, default=True\n    Whether to highlight outliers\nshow_variance : bool, default=True\n    Whether to show explained variance in labels\nellipse_kwargs : dict, optional\n    Keyword arguments for ellipse\nscatter_kwargs : dict, optional\n    Keyword arguments for inlier scatter\noutlier_kwargs : dict, optional\n    Keyword arguments for outlier scatter\n    \nReturns\n-------\nax : matplotlib.axes.Axes\n    Axes object\npca : sklearn.decomposition.PCA\n    Fitted PCA object\n    \nExamples\n--------\n>>> detector = MahalanobisOutlierDetector(['TEX86', 'ringIndex', 'fGDGT_0', 'fGDGT_cren'])\n>>> detector.fit(coretop_df)\n>>> ax, pca = detector.plot_pca_projection(coretop_df)\n>>> print(f\"Variance explained: {pca.explained_variance_ratio_}\")","x":"","priv":false,"path":"src/TEXAS/data/screening.py"},"data.screening.MahalanobisOutlierDetector.plot_corner":{"n":"plot_corner","m":"data.screening","c":"MahalanobisOutlierDetector","nest":null,"l":1032,"e":1132,"sig":"plot_corner(self, df: pd.DataFrame, figsize: tuple, show_outliers: bool, **kwargs)","doc":"Create corner plot (lower triangle pairwise plots with marginals).\nSimilar to corner.py but integrated with Mahalanobis detection.\n\nParameters\n----------\ndf : pd.DataFrame\n    Data to visualize\nfigsize : tuple, optional\n    Figure size\nshow_outliers : bool, default=True\n    Whether to highlight outliers\n**kwargs\n    Additional styling arguments\n    \nReturns\n-------\nfig : matplotlib.figure.Figure\n    Figure object\naxs : array of matplotlib.axes.Axes\n    Grid of axes","x":"","priv":false,"path":"src/TEXAS/data/screening.py"},"diagnostics.summarize_sampler_diagnostics":{"n":"summarize_sampler_diagnostics","m":"diagnostics","c":null,"nest":null,"l":6,"e":69,"sig":"summarize_sampler_diagnostics(fit) -> dict","doc":"Extract ``divergent__``, ``treedepth__``, E-BFMI, R_hat, and ESS_bulk\nfrom a CmdStanPy fit and return them as stan_diag_* attrs.","x":"Condenses divergences, R-hat, ESS and E-BFMI into a dict that gets attached to the posterior as stan_diag_* attrs, so a saved run carries its own health check.","priv":false,"path":"src/TEXAS/diagnostics.py"},"diagnostics.create_summary_table":{"n":"create_summary_table","m":"diagnostics","c":null,"nest":null,"l":72,"e":83,"sig":"create_summary_table(datasets: list) -> pd.DataFrame","doc":"Build a DataFrame summarizing the stan_diag_* attrs from each xarray.Dataset.","x":"","priv":false,"path":"src/TEXAS/diagnostics.py"},"ensemble.detection.available_suffixes":{"n":"available_suffixes","m":"ensemble.detection","c":null,"nest":null,"l":17,"e":31,"sig":"available_suffixes(posterior_ds: xr.Dataset, param_basenames)","doc":"Return a set of suffixes present for ANY of the given param basenames.\nSupports both 'base_suffix' and no-suffix ('base') styles.","x":"","priv":false,"path":"src/TEXAS/ensemble/detection.py"},"ensemble.detection.choose_suffix":{"n":"choose_suffix","m":"ensemble.detection","c":null,"nest":null,"l":33,"e":48,"sig":"choose_suffix(posterior_ds: xr.Dataset, param_basenames, preferred: str | None)","doc":"Choose a suffix using global priority from SUFFIX_PRIORITY,\nconstrained to suffixes that actually exist for the given basenames.\nIf 'preferred' is supplied, require it to be present.","x":"Applies the suffix priority order (crtp > culmesocore > culmeso > meso > cul) so the most data-rich parameter set available in a posterior is the one used.","priv":false,"path":"src/TEXAS/ensemble/detection.py"},"ensemble.detection.detect_model_and_params":{"n":"detect_model_and_params","m":"ensemble.detection","c":null,"nest":null,"l":50,"e":142,"sig":"detect_model_and_params(posterior_ds: xr.Dataset, suffix: str)","doc":"Auto-detect which logistic model and parameters to use.\nUses a shared suffix priority via choose_suffix().","x":"Infers which curve function and which parameter names to use from the posterior itself. It reads use_gdgt23ratio / use_no3 / no3_cutoff from attrs and infers the model form from data_vars, deliberately not from stan_model_name.","priv":false,"path":"src/TEXAS/ensemble/detection.py"},"ensemble.generator.generate_ensemble":{"n":"generate_ensemble","m":"ensemble.generator","c":null,"nest":null,"l":9,"e":141,"sig":"generate_ensemble(post_ds: xr.Dataset, model_function: Callable[..., np.ndarray], x_vals: np.ndarray, param_names: List[str], suffix: Optional[str], n_draws: int, seed: Optional[int], percentiles: List[float], return_full_ensemble: bool, gdgt23ratio: Optional[np.ndarray], no3: Optional[np.ndarray], no3_cutoff: Optional[float], is_multivariate: Optional[bool], use_gdgt23ratio_flag: Optional[bool], use_no3_flag: Optional[bool]) -> Dict[str, np.ndarray]","doc":"Generate an ensemble of curves from a posterior dataset using any model function.\n(Exact port of your old stan_utils.py version.)","x":"Draws n_draws posterior indices and evaluates model_func at every x value, returning percentiles and optionally the full ensemble. All parameters for a given draw come from the same posterior index, which preserves their correlations. model_func arrives as a callable, so this edge is invisible to static analysis.","priv":false,"path":"src/TEXAS/ensemble/generator.py"},"ensemble.generator.generate_ensemble_auto":{"n":"generate_ensemble_auto","m":"ensemble.generator","c":null,"nest":null,"l":143,"e":230,"sig":"generate_ensemble_auto(post_ds: xr.Dataset, x_vals: np.ndarray, model_type: Literal['auto', 'forward', 'inverse'], gdgt23ratio: Optional[np.ndarray], no3: Optional[np.ndarray], no3_cutoff: Optional[float], return_full_ensemble: bool, suffix: Optional[str], **kwargs) -> Dict[str, np.ndarray]","doc":"Sample draws from a forward posterior and compute calibration-curve percentiles.\n\nInspects the posterior's ``stan_model_name`` attr and ``data_vars`` to\ndetermine the model function, parameter names, and optional-predictor\nflags automatically, then delegates to ``generate_ensemble``.\n\nParameters\n----------\npost_ds : xr.Dataset\n    Forward calibration posterior returned by ``get_posterior()`` or\n    loaded with ``load_posterior()``.\nx_vals : np.ndarray\n    Temperature values (°C) at which to evaluate the calibration curve.\nmodel_type : {\"auto\", \"forward\", \"inverse\"}\n    Force forward or inverse dispatch; ``\"auto\"`` (default) infers from\n    the posterior.  InvT posteriors are not supported — use\n    ``predict_T_from_proxyObs()`` instead.\ngdgt23ratio : np.ndarray, optional\n    GDGT-2/3 ratio values; required when the posterior was fitted with\n    a multivariate (GDGT-2/3) model.\nno3 : np.ndarray, optional\n    NO₃ concentrations (µmol/L); required when the posterior uses the\n    NO₃ correction.\nno3_cutoff : float, optional\n    Override the NO₃ cutoff from the posterior attrs.\nreturn_full_ensemble : bool\n    If ``True``, return the full M × N draw matrix in addition to\n    percentiles.  Default ``False``.\nsuffix : str, optional\n    Force a specific parameter suffix (e.g. ``\"crtp\"``); overrides\n    auto-detection.\n**kwargs\n    Forwarded to ``generate_ensemble``.\n\nReturns\n-------\n…","x":"The auto-dispatching front end for forward curves. It reads the posterior's data_vars and attrs to infer the model function, parameter suffix and predictor flags, then delegates to generate_ensemble. It refuses invT posteriors, which is the common mistake.","priv":false,"path":"src/TEXAS/ensemble/generator.py"},"models.calibration.TEX86Calibration.__init__":{"n":"__init__","m":"models.calibration","c":"TEX86Calibration","nest":null,"l":19,"e":41,"sig":"__init__(self, name: str, slope: float, intercept: float, transform: Literal['linear', 'log10', 'ln', 'inverse'])","doc":"Parameters\n----------\nname : str\n    Calibration name (e.g., 'kim2010_tex86H')\nslope : float\n    Slope parameter (a)\nintercept : float\n    Intercept parameter (b)\ntransform : str\n    Transformation type: 'linear', 'log10', 'ln', 'inverse'","x":"","priv":false,"path":"src/TEXAS/models/calibration.py"},"models.calibration.TEX86Calibration.predict_sst":{"n":"predict_sst","m":"models.calibration","c":"TEX86Calibration","nest":null,"l":43,"e":69,"sig":"predict_sst(self, tex86: Union[float, np.ndarray]) -> Union[float, np.ndarray]","doc":"Predict SST from TEX86.\n\nParameters\n----------\ntex86 : float or array\n    TEX86 values\n    \nReturns\n-------\nsst : float or array\n    Predicted SST (°C)","x":"","priv":false,"path":"src/TEXAS/models/calibration.py"},"models.calibration.TEX86Calibration.predict_tex86":{"n":"predict_tex86","m":"models.calibration","c":"TEX86Calibration","nest":null,"l":71,"e":102,"sig":"predict_tex86(self, sst: Union[float, np.ndarray]) -> Union[float, np.ndarray]","doc":"Predict TEX86 from SST (inverse calibration).\n\nParameters\n----------\nsst : float or array\n    Sea surface temperature (°C)\n    \nReturns\n-------\ntex86 : float or array\n    Predicted TEX86 values","x":"","priv":false,"path":"src/TEXAS/models/calibration.py"},"models.calibration.TEX86Calibration.__repr__":{"n":"__repr__","m":"models.calibration","c":"TEX86Calibration","nest":null,"l":104,"e":105,"sig":"__repr__(self)","doc":"","x":"","priv":true,"path":"src/TEXAS/models/calibration.py"},"models.calibration.CalibrationRegistry.get":{"n":"get","m":"models.calibration","c":"CalibrationRegistry","nest":null,"l":147,"e":164,"sig":"get(cls, name: str) -> TEX86Calibration","doc":"Get calibration by name.\n\nParameters\n----------\nname : str\n    Calibration name\n    \nReturns\n-------\ncalibration : TEX86Calibration\n    Calibration object","x":"","priv":false,"path":"src/TEXAS/models/calibration.py"},"models.calibration.CalibrationRegistry.list_calibrations":{"n":"list_calibrations","m":"models.calibration","c":"CalibrationRegistry","nest":null,"l":167,"e":169,"sig":"list_calibrations(cls) -> list[str]","doc":"List all available calibration names.","x":"","priv":false,"path":"src/TEXAS/models/calibration.py"},"models.calibration.CalibrationRegistry.add_calibration":{"n":"add_calibration","m":"models.calibration","c":"CalibrationRegistry","nest":null,"l":172,"e":190,"sig":"add_calibration(cls, name: str, slope: float, intercept: float, transform: str)","doc":"Add a custom calibration to the registry.\n\nParameters\n----------\nname : str\n    Calibration name\nslope : float\n    Slope parameter\nintercept : float\n    Intercept parameter\ntransform : str\n    Transformation type: 'linear', 'log10', 'ln', 'inverse'","x":"","priv":false,"path":"src/TEXAS/models/calibration.py"},"models.calibration.predict_sst_from_tex86":{"n":"predict_sst_from_tex86","m":"models.calibration","c":null,"nest":null,"l":194,"e":214,"sig":"predict_sst_from_tex86(tex86: Union[float, np.ndarray], method: str) -> Union[float, np.ndarray]","doc":"Predict SST from TEX86 using a specific calibration.\n\nParameters\n----------\ntex86 : float or array\n    TEX86 values\nmethod : str\n    Calibration method name\n    \nReturns\n-------\nsst : float or array\n    Predicted SST (°C)","x":"","priv":false,"path":"src/TEXAS/models/calibration.py"},"models.calibration.predict_tex86_from_sst":{"n":"predict_tex86_from_sst","m":"models.calibration","c":null,"nest":null,"l":217,"e":237,"sig":"predict_tex86_from_sst(sst: Union[float, np.ndarray], method: str) -> Union[float, np.ndarray]","doc":"Predict TEX86 from SST using a specific calibration.\n\nParameters\n----------\nsst : float or array\n    Sea surface temperature (°C)\nmethod : str\n    Calibration method name\n    \nReturns\n-------\ntex86 : float or array\n    Predicted TEX86 values","x":"","priv":false,"path":"src/TEXAS/models/calibration.py"},"models.logistics.logistic":{"n":"logistic","m":"models.logistics","c":null,"nest":null,"l":5,"e":31,"sig":"logistic(x, t0, x0, L, k, b)","doc":"Four-parameter logistic function.\n\nParameters\n----------\nx : array-like\n    Input (temperature, etc.).\nt0, x0 : float\n    Inflection point (prefer t0; x0 allowed for legacy).\nL : float\n    Upper asymptote.\nk : float\n    Slope.\nb : float\n    Lower asymptote.\n\nReturns\n-------\ny : np.ndarray\n    Model output.","x":"","priv":false,"path":"src/TEXAS/models/logistics.py"},"models.logistics.logistic_fixed_upper":{"n":"logistic_fixed_upper","m":"models.logistics","c":null,"nest":null,"l":34,"e":53,"sig":"logistic_fixed_upper(x, t0, x0, k, b)","doc":"Three-parameter logistic with upper asymptote 1.\n\nParameters\n----------\nx : array-like\nt0, x0 : float\nk : float\nb : float\n\nReturns\n-------\ny : np.ndarray","x":"","priv":false,"path":"src/TEXAS/models/logistics.py"},"models.logistics.inverse_logistic_fixed_upper":{"n":"inverse_logistic_fixed_upper","m":"models.logistics","c":null,"nest":null,"l":56,"e":75,"sig":"inverse_logistic_fixed_upper(y, t0, x0, k, b)","doc":"Inverse of three-parameter logistic with upper asymptote 1.\n\nParameters\n----------\ny : array-like\nt0, x0 : float\nk : float\nb : float\n\nReturns\n-------\nx : np.ndarray","x":"","priv":false,"path":"src/TEXAS/models/logistics.py"},"models.logistics.generalized_logistic":{"n":"generalized_logistic","m":"models.logistics","c":null,"nest":null,"l":78,"e":107,"sig":"generalized_logistic(x: np.ndarray, t0: float, x0: float, a: float, b: float, k: float, v: float, Q: float)","doc":"Generalized logistic function.\n\nParameters\n----------\nx : array-like\nt0, x0 : float\na, b : float\n    Upper/lower asymptotes.\nk, v, Q : float\n\nReturns\n-------\ny : np.ndarray","x":"","priv":false,"path":"src/TEXAS/models/logistics.py"},"models.logistics.generalized_logistic_fixed_upper":{"n":"generalized_logistic_fixed_upper","m":"models.logistics","c":null,"nest":null,"l":110,"e":131,"sig":"generalized_logistic_fixed_upper(x: np.ndarray, t0: float, x0: float, b: float, k: float, v: float) -> np.ndarray","doc":"4-parameter generalized logistic with upper asymptote fixed at 1 and Q=1.\ny = b + (1 - b) / (1 + exp(-k*(x - t0)))^(1/v)\n\nv defaults to 1.0 if not provided.","x":"The forward calibration curve itself: a generalized logistic in temperature with a fixed upper asymptote. Since the Q asymmetry parameter was dropped, Q = 1 and the inflection point sits at t0.","priv":false,"path":"src/TEXAS/models/logistics.py"},"models.logistics.inverse_generalized_logistic_fixed_upper":{"n":"inverse_generalized_logistic_fixed_upper","m":"models.logistics","c":null,"nest":null,"l":134,"e":155,"sig":"inverse_generalized_logistic_fixed_upper(y: np.ndarray, t0: float, x0: float, b: float, k: float, v: float) -> np.ndarray","doc":"Inverse of generalized_logistic_fixed_upper: given y, return x.\nx = t0 - ln(((1-b)/(y-b))^v - 1) / k\n\nv defaults to 1.0 if not provided.","x":"Closed-form inversion of the calibration curve. Useful for point estimates and plotting, but it is not the inverse reconstruction: that is Bayesian and lives in stan/invT.py.","priv":false,"path":"src/TEXAS/models/logistics.py"},"models.multivariate._broadcast_predictor":{"n":"_broadcast_predictor","m":"models.multivariate","c":null,"nest":null,"l":13,"e":28,"sig":"_broadcast_predictor(values, shape, name)","doc":"Coerce an optional predictor to ``shape``.\n\nAccepts a scalar (applied to every sample) or an array broadcastable to\n``shape`` (per-sample values).  Returns a float array of exactly ``shape``.\nRaises ``ValueError`` with a clear message if the array cannot be\nbroadcast (e.g. a length-3 array against 5 samples).","x":"","priv":true,"path":"src/TEXAS/models/multivariate.py"},"models.multivariate.simple_logistic_fixed_upper_multivariate":{"n":"simple_logistic_fixed_upper_multivariate","m":"models.multivariate","c":null,"nest":null,"l":37,"e":75,"sig":"simple_logistic_fixed_upper_multivariate(x: np.ndarray, t0: float, x0: float, b: float, k: float, beta_G23: float, gdgt23ratio: np.ndarray, beta_NO3: float, no3: np.ndarray, no3_cutoff: float) -> np.ndarray","doc":"3-parameter logistic (upper asymptote fixed at 1) plus optional linear corrections.\ny = b + (1 - b) / (1 + exp(-k*(x - inflection))) \n    + beta_G23 * gdgt23ratio \n    + beta_NO3 * log10(no3) [only where 0 < no3 < no3_cutoff]","x":"","priv":false,"path":"src/TEXAS/models/multivariate.py"},"models.multivariate.generalized_logistic_fixed_upper_multivariate":{"n":"generalized_logistic_fixed_upper_multivariate","m":"models.multivariate","c":null,"nest":null,"l":78,"e":125,"sig":"generalized_logistic_fixed_upper_multivariate(x: np.ndarray, t0: float, x0: float, b: float, k: float, v: float, beta_G23: float, gdgt23ratio: np.ndarray, beta_NO3: float, no3: np.ndarray, no3_cutoff: float) -> np.ndarray","doc":"4-parameter generalized logistic (upper asymptote fixed at 1, Q fixed at 1)\nplus optional corrections.\ny = b + (1 - b) / (1 + exp(-k*(x - inf)))^(1/v)\n    + beta_G23 * gdgt23ratio\n    + beta_NO3 * log10(no3) [only where 0 < no3 < no3_cutoff]\n\nIf v is None it defaults to 1.0 (reducing to the standard logistic).","x":"The multivariate forward curve, adding the GDGT-2/3 and below-cutoff NO3 correction terms to the thermal generalized logistic.","priv":false,"path":"src/TEXAS/models/multivariate.py"},"models.multivariate.generalized_logistic_fixed_upper_t0shift":{"n":"generalized_logistic_fixed_upper_t0shift","m":"models.multivariate","c":null,"nest":null,"l":128,"e":195,"sig":"generalized_logistic_fixed_upper_t0shift(x: np.ndarray, t0: float, x0: float, b: float, k: float, v: float, gamma_G23: float, gdgt23ratio: np.ndarray, gamma_NO3: float, no3: np.ndarray, no3_cutoff: float) -> np.ndarray","doc":"Bounded-T counterpart of :func:`generalized_logistic_fixed_upper_multivariate`.\n\nThe corrections shift the curve's location parameter rather than the mean::\n\n    t0_eff = t0 + gamma_G23 * gdgt23ratio\n                + gamma_NO3 * log10(no3)   [only where 0 < no3 < no3_cutoff]\n    y      = b + (1 - b) / (1 + exp(-k*(x - t0_eff)))^(1/v)\n\nThat keeps ``y`` inside ``(b, 1)`` for every finite predictor value, which is\nthe entire point of the parameterisation — the additive form can push the\nmean outside the proxy's range. Mirrors ``bounded_mu()`` in\n``gen_logi_fixed_hier_crtp_multiv_priorApprox_eiv_t0shift.stan``, including\nthe NO3 gate.\n\nOne deliberate difference from the Stan model: there, the gate is applied to\nthe OBSERVED nitrate while ``log10`` is taken of the LATENT (EIV) value. A\nplotted curve has only one nitrate array to work from, so it is used for\nboth — exactly as the additive Python function already does.\n\n**That difference is not cosmetic.** Fed this function's own convention, the\nper-draw ``mu_max`` sits ~0.1 above the ``mu_max`` Stan recorded in generated\nquantities; fed the latent values from ``true_no3_crtp`` /\n``true_gdgt23ratio_crtp``, it reproduces Stan to 8e-7 (float32 storage\nprecision), which is how the formula here was verified. So a curve drawn\nfrom observed predictors is the right thing for plotting against observed\n…","x":"","priv":false,"path":"src/TEXAS/models/multivariate.py"},"models.multivariate.inverse_generalized_logistic_fixed_upper_multivariate":{"n":"inverse_generalized_logistic_fixed_upper_multivariate","m":"models.multivariate","c":null,"nest":null,"l":198,"e":325,"sig":"inverse_generalized_logistic_fixed_upper_multivariate(y: np.ndarray, t0: float, x0: float, b: float, k: float, v: float, beta_G23: float, gdgt23ratio: np.ndarray, beta_NO3: float, no3: np.ndarray, no3_cutoff: float) -> np.ndarray","doc":"Invert :func:`generalized_logistic_fixed_upper_multivariate`.\n\nGiven proxy observations ``y`` (e.g. Scaled Ring Index), return the\ntemperature ``x`` (e.g. SST) that the forward model maps to ``y`` for a\n*single* parameter set.  The two non-thermal corrections are additive and\nindependent of temperature, so inversion subtracts them off and then\ninverts the pure thermal curve analytically::\n\n    y_thermal = y - beta_G23 * gdgt23ratio\n                  - beta_NO3 * log10(no3)   [only where 0 < no3 < no3_cutoff]\n    x = t0 - ln(((1 - b) / (y_thermal - b))**v - 1) / k\n\n``gdgt23ratio`` and ``no3`` may each be a single scalar (applied to every\nsample) or an array of per-sample values broadcastable to ``y``.  Supply\nthe *same* covariate values that applied to those observations — they are\nadditive predictors, not solved for.\n\nThe thermal inverse is defined only for ``b < y_thermal < 1``.  Proxy\nvalues outside that range are physically unreachable for the given\nparameters and are returned as ``np.nan`` (a single ``RuntimeWarning`` is\nemitted if any occur).\n\n.. note::\n   This is a deterministic **point** inverse for one parameter set (e.g.\n   posterior means).  For uncertainty-aware paleotemperature\n   reconstruction that marginalises over the full forward posterior, use\n   :func:`TEXAS.predict.predict_T_from_proxyObs` (the Bayesian Stan path).\n\nParameters\n----------\ny : array-like\n…","x":"","priv":false,"path":"src/TEXAS/models/multivariate.py"},"models.multivariate.find_optimal_no3_threshold":{"n":"find_optimal_no3_threshold","m":"models.multivariate","c":null,"nest":null,"l":328,"e":494,"sig":"find_optimal_no3_threshold(no3_values: np.ndarray, residuals: np.ndarray, threshold_range, min_points: int, log_method: str, score_method: str, weight_method: str)","doc":"Find the NO3 threshold that maximises the negative correlation between\nlog(NO3) and model residuals.\n\nUsed to select the ``no3_cutoff`` parameter for the multivariate logistic\nmodels: points below the threshold carry an NO3 correction; points above\nare treated as nutrient-replete and excluded from the NO3 term.\n\nParameters\n----------\nno3_values : array-like\n    Nitrate concentrations (µmol/L).\nresiduals : array-like\n    Residuals from a temperature-only model fit on the same observations.\nthreshold_range : array-like, optional\n    NO3 thresholds to test.  Defaults to ``np.arange(0.5, 5, 0.01)``.\nmin_points : int\n    Minimum number of valid data points required to compute a score.\nlog_method : {'log10', 'ln'}\n    Log transform applied to NO3 values before scoring.\n\n    ``'log10'`` (default)\n        Base-10 logarithm — consistent with prior publication and the\n        original Stan model formulation.\n    ``'ln'``\n        Natural logarithm — use to test sensitivity to the log base.\n\nscore_method : {'spearmanr', 'R_squared'}\n    Criterion used to select the optimal threshold.\n\n    ``'spearmanr'`` (default)\n        Most negative Spearman ρ between log(NO3) and residuals.\n        Rank-based; robust to outliers.  Used in prior publication.\n    ``'R_squared'``\n        Highest no-intercept R² of ``RI_res = β · log(NO3)`` with β < 0.\n…","x":"Scans candidate NO3 cutoffs and scores each by Spearman rank correlation between the cutoff-gated NO3 and the thermal residuals. Supplies the value build_fwd_data uses when no3_cutoff is omitted.","priv":false,"path":"src/TEXAS/models/multivariate.py"},"models.multivariate.find_optimal_no3_threshold_nointercept":{"n":"find_optimal_no3_threshold_nointercept","m":"models.multivariate","c":null,"nest":null,"l":497,"e":651,"sig":"find_optimal_no3_threshold_nointercept(no3_values: np.ndarray, residuals: np.ndarray, threshold_range, min_points: int, no3_mode: str, log_method: str, weight_method: str)","doc":"Find the NO3 threshold that maximises the no-intercept R² of\n``RI_res = β · x``, consistent with the no3ratio Stan model formulation\nwhere the correction is exactly zero at the threshold boundary.\n\nUnlike ``find_optimal_no3_threshold`` (Spearman-based, used in prior\npublication), this function optimises for the threshold that best explains\nresidual variance under the zero-intercept constraint.\n\nParameters\n----------\nno3_values : array-like\n    Nitrate concentrations (µmol/L).\nresiduals : array-like\n    Residuals from a temperature-only model fit on the same observations.\nthreshold_range : array-like, optional\n    NO3 thresholds to test.  Defaults to ``np.arange(0.5, 5, 0.01)``.\nmin_points : int\n    Minimum number of valid data points required to fit the regression.\nno3_mode : {'log10ratio', 'log10'}\n    Predictor used in the no-intercept regression:\n\n    ``'log10ratio'`` (default)\n        ``x = log10(no3 / threshold)`` — zero at the boundary; consistent\n        with the ``_no3ratio`` Stan models.  The optimal threshold is where\n        the no-intercept model best fits the data with correction = 0 at T.\n\n    ``'log10'``\n        ``x = log10(no3)`` — zero at no3 = 1 µmol/L regardless of T;\n        consistent with the original Stan models.  Use this to compare the\n        no-intercept R² criterion against the Spearman criterion while\n        keeping the original predictor form.\n\n…","x":"","priv":false,"path":"src/TEXAS/models/multivariate.py"},"plotting.prior_plot._group_label":{"n":"_group_label","m":"plotting.prior_plot","c":null,"nest":null,"l":86,"e":92,"sig":"_group_label(group: str, suffix: str) -> str","doc":"Axis / legend label for a group prefix, falling back to the raw prefix.","x":"","priv":true,"path":"src/TEXAS/plotting/prior_plot.py"},"plotting.prior_plot._build_label_maps":{"n":"_build_label_maps","m":"plotting.prior_plot","c":null,"nest":null,"l":95,"e":113,"sig":"_build_label_maps(groups: Sequence[str]) -> Dict[str, str]","doc":"Legend labels for ``{group}_{suffix}`` variables, e.g. gamma_G23_culmeso.\n\nLongest key first so ``beta_G23_crtp`` is never matched by a shorter,\ncoincidentally-prefixed key.","x":"","priv":true,"path":"src/TEXAS/plotting/prior_plot.py"},"plotting.prior_plot._param_group":{"n":"_param_group","m":"plotting.prior_plot","c":null,"nest":null,"l":116,"e":123,"sig":"_param_group(name: str, groups: Sequence[str]) -> Optional[str]","doc":"Return the group a posterior variable belongs to, or None.\n\nLongest prefix wins, so ``betaLogit_G23_crtp`` cannot be captured by a\nshorter group that happens to prefix it.","x":"","priv":true,"path":"src/TEXAS/plotting/prior_plot.py"},"plotting.prior_plot._parse_trunc":{"n":"_parse_trunc","m":"plotting.prior_plot","c":null,"nest":null,"l":126,"e":136,"sig":"_parse_trunc(trunc: Optional[str]) -> Optional[tuple]","doc":"Turn the inside of a ``T[lo, hi]`` into ``(lo, hi)``; either may be None.","x":"","priv":true,"path":"src/TEXAS/plotting/prior_plot.py"},"plotting.prior_plot._declaration_bounds":{"n":"_declaration_bounds","m":"plotting.prior_plot","c":null,"nest":null,"l":139,"e":168,"sig":"_declaration_bounds(posterior_datasets: Sequence['xr.Dataset']) -> Dict[str, str]","doc":"Recover implicit prior truncation from the packaged .stan files.\n\nA posterior cached before the prior extractor understood declaration bounds\nstores ``gamma_G23_crtp: normal(0, 1.0)`` for what is really a HALF-normal\n(``real<lower=0>``).  Re-reading the model file restores the bound without a\nrefit.  Best-effort — a dataset whose model file is not packaged is skipped,\nand an explicit ``T[…]`` already in the prior string always wins.","x":"","priv":true,"path":"src/TEXAS/plotting/prior_plot.py"},"plotting.prior_plot._format_stat":{"n":"_format_stat","m":"plotting.prior_plot","c":null,"nest":null,"l":171,"e":192,"sig":"_format_stat(median: float, std: float) -> str","doc":"Return 'median ± std' formatted to appropriate significant figures.\n\nThe uncertainty drives the precision:\n- Round std to 1 sig fig (2 sig figs if its leading digit is 1 or 2,\n  since one sig fig would be too coarse there).\n- Round median to the same decimal place.\n\nExamples\n--------\n>>> _format_stat(35.812, 0.845)   # σ leading digit 8 → 1 sig fig\n'35.8 ± 0.8'\n>>> _format_stat(0.02451, 0.00234)  # σ leading digit 2 → 2 sig figs\n'0.0245 ± 0.0023'\n>>> _format_stat(35.0, 1.52)      # σ leading digit 1 → 2 sig figs\n'35.0 ± 1.5'","x":"","priv":true,"path":"src/TEXAS/plotting/prior_plot.py"},"plotting.prior_plot._n_decimals":{"n":"_n_decimals","m":"plotting.prior_plot","c":null,"nest":null,"l":194,"e":200,"sig":"_n_decimals(scale: float) -> int","doc":"Decimal places needed to show `scale` to 1–2 sig figs (GUM §7.2.6 rule).","x":"","priv":true,"path":"src/TEXAS/plotting/prior_plot.py"},"plotting.prior_plot._format_ci":{"n":"_format_ci","m":"plotting.prior_plot","c":null,"nest":null,"l":203,"e":216,"sig":"_format_ci(median: float, p5: float, p95: float) -> str","doc":"Return 'median [p5, p95]' with sig figs driven by the interval half-width.\n\nExamples\n--------\n>>> _format_ci(31.2, 28.4, 34.1)\n'31.2 [28.4, 34.1]'\n>>> _format_ci(0.245, 0.18, 0.31)\n'0.245 [0.180, 0.310]'","x":"","priv":true,"path":"src/TEXAS/plotting/prior_plot.py"},"plotting.prior_plot._format_prior_expr":{"n":"_format_prior_expr","m":"plotting.prior_plot","c":null,"nest":null,"l":219,"e":247,"sig":"_format_prior_expr(dist: str, a: float, b: float, trunc: Optional[str]) -> str","doc":"Return a 'distributed as' string for a prior.\n\nNotation follows McElreath (Statistical Rethinking) / Stan convention:\nθ ~ Normal(μ, σ) where σ is the standard deviation.\nThe '~' is written as plain text outside math mode so it renders\nas a tilde rather than the math-mode '∼' (similar-to) symbol.","x":"","priv":true,"path":"src/TEXAS/plotting/prior_plot.py"},"plotting.prior_plot._format_prior_expr._fmt":{"n":"_fmt","m":"plotting.prior_plot","c":null,"nest":"_format_prior_expr","l":227,"e":228,"sig":"_fmt(v: float) -> str","doc":"","x":"","priv":true,"path":"src/TEXAS/plotting/prior_plot.py"},"plotting.prior_plot.plot_prior_distributions":{"n":"plot_prior_distributions","m":"plotting.prior_plot","c":null,"nest":null,"l":257,"e":764,"sig":"plot_prior_distributions(priors_list: Optional[Union[List[str], Dict[str, str]]], posterior_datasets: Optional[List['xr.Dataset']], posterior_labels_list: Optional[List[str]], show_suptitle: bool, kde_bw: float, focus_on_posterior: bool, include_groups: Sequence[str], suffix_include: Optional[List[str]], zoomin_suffix: Optional[Union[str, List[str]]], zoomin_dataset_idx: Optional[int], use_linestyle_by_param: bool, show_histogram: bool, show_annotation: bool, set_linewidth: float, set_fig_width_factor: float, set_fig_height_factor: float, set_leg_max_ncol: int, color_list: Optional[Sequence[str]], param_source_map: Optional[Dict[str, int]], annotation_style: Literal['ci95', 'ci68', 'sigma'], show_subplot_legend: bool, show_figure_legend: bool, show_prior_expression: bool, cache_dir: Optional[Union[str, Path]])","doc":"Plot priors + any number of posterior distributions in a grid,\nsplit by parameter group (t0, k, b, etc.).\n\nArgs:\n    param_source_map: Optional dict mapping a param group name to the index of\n        the dataset in ``posterior_datasets`` that should be used as the sole\n        source for that group.  All other datasets are skipped for that group.\n\n        Use this when different parameters come from different posteriors — e.g.\n        logistic params (t0, k, b…) from a ``culmeso`` run and beta coefficients\n        from a multivariate ``crtp`` run::\n\n            plot_prior_distributions(\n                posterior_datasets=[culmeso_ds, crtp_multiv_ds],\n                param_source_map={\"beta_G23\": 1, \"beta_NO3\": 1},\n            )\n\n        When a group is not in ``param_source_map``, all datasets are searched\n        as usual.\n    include_groups: Parameter-group prefixes to draw, in panel order.  The\n        default covers the thermal parameters plus every coefficient naming\n        scheme in ``PREDICTOR_GROUPS`` (``beta_*`` for the parent model,\n        ``gamma_*`` for t0shift, ``betaLogit_*`` for boundedCeil), so the\n        same call works for any of them and for figures mixing several.\n        A group with no matching variable in any dataset is skipped, as is a\n        coefficient group whose predictor no dataset switched on.\n…","x":"","priv":false,"path":"src/TEXAS/plotting/prior_plot.py"},"plotting.prior_plot.plot_prior_distributions._plot_line":{"n":"_plot_line","m":"plotting.prior_plot","c":null,"nest":"plot_prior_distributions","l":602,"e":623,"sig":"_plot_line(param_label, idx_ds, color, linestyle, kde_y, samples, stan_model_label)","doc":"","x":"","priv":true,"path":"src/TEXAS/plotting/prior_plot.py"},"plotting.range_utils.compute_sample_range":{"n":"compute_sample_range","m":"plotting.range_utils","c":null,"nest":null,"l":7,"e":12,"sig":"compute_sample_range(samples: Sequence[float]) -> Tuple[Optional[float], Optional[float]]","doc":"","x":"","priv":false,"path":"src/TEXAS/plotting/range_utils.py"},"plotting.range_utils.compute_density_based_range":{"n":"compute_density_based_range","m":"plotting.range_utils","c":null,"nest":null,"l":14,"e":30,"sig":"compute_density_based_range(samples: Sequence[float], kde_bw: float, density_threshold: float) -> Tuple[Optional[float], Optional[float]]","doc":"","x":"","priv":false,"path":"src/TEXAS/plotting/range_utils.py"},"plotting.range_utils.compute_suffix_specific_range":{"n":"compute_suffix_specific_range","m":"plotting.range_utils","c":null,"nest":null,"l":32,"e":47,"sig":"compute_suffix_specific_range(all_samples: List[Tuple[np.ndarray, int, str, str, int, int]], target_suffix: str) -> Tuple[Optional[float], Optional[float]]","doc":"","x":"","priv":false,"path":"src/TEXAS/plotting/range_utils.py"},"plotting.range_utils.compute_dataset_specific_range":{"n":"compute_dataset_specific_range","m":"plotting.range_utils","c":null,"nest":null,"l":49,"e":64,"sig":"compute_dataset_specific_range(all_samples: List[Tuple[np.ndarray, int, str, str, int, int]], target_dataset_idx: int) -> Tuple[Optional[float], Optional[float]]","doc":"","x":"","priv":false,"path":"src/TEXAS/plotting/range_utils.py"},"plotting.residual_maps.make_krige_grid":{"n":"make_krige_grid","m":"plotting.residual_maps","c":null,"nest":null,"l":83,"e":87,"sig":"make_krige_grid(res: float)","doc":"Return (grid_lon, grid_lat) for a given resolution, WOA23-aligned.","x":"","priv":false,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps._require_cartopy":{"n":"_require_cartopy","m":"plotting.residual_maps","c":null,"nest":null,"l":107,"e":116,"sig":"_require_cartopy() -> None","doc":"Raise a clear error if the optional map-plotting deps are missing.","x":"","priv":true,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps._krige_panel_worker":{"n":"_krige_panel_worker","m":"plotting.residual_maps","c":null,"nest":null,"l":134,"e":186,"sig":"_krige_panel_worker(i: int, res_vals: np.ndarray, method_label: str, lons: np.ndarray, lats: np.ndarray, grid_lon: np.ndarray, grid_lat: np.ndarray, n_closest: int, max_dist_deg: float, grid_res: float) -> Tuple[int, np.ma.MaskedArray]","doc":"Run OrdinaryKriging for one panel and return (index, masked_array).\nAll data passed explicitly — no globals captured across process boundaries.","x":"","priv":true,"path":"src/TEXAS/plotting/residual_maps.py"},"plotting.residual_maps.krige_halo_all":{"n":"krige_halo_all","m":"plotting.residual_maps","c":null,"nest":null,"l":189,"e":251,"sig":"krige_halo_all(data: list, lons: np.ndarray, lats: n
