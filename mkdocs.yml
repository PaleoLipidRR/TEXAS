site_name: TEXAS
site_description: "TetraEther indeX for Ammonia oxidizerS — Bayesian proxy system model for TEX86 paleothermometry"
site_url: https://paleolipidrr.github.io/TEXAS/
repo_url: https://github.com/PaleoLipidRR/TEXAS
repo_name: PaleoLipidRR/TEXAS

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
  palette:
    primary: teal
    accent: teal

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Quickstart: index.md
  - Installation: installation.md
  - API Reference: api.md

exclude_docs: |
  README.md
  publication_plan.md
  publishing.md
  zenodo_publishing_guide.md
  *.pdf
  stan_reduce_sum_notes.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML
