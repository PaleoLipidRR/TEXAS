name: texas-env
channels:
  - conda-forge
channel_priority: strict

dependencies:
  # --- Core & Environment ---
  - python=3.10
  - pip
  - jupyterlab
  - ipywidgets
  - tqdm

  # --- Core Scientific Stack ---
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - statsmodels
  - seaborn
  
  # --- Core Data Handling ---
  - xarray
  - dask
  - distributed
  - zarr
  - netcdf4
  - h5netcdf
  - cftime

  # --- Plotting (Stable Pinned Versions) ---
  - matplotlib<3.5
  - proplot=0.9.7
  - setuptools<81
  - cmocean
  - plotly