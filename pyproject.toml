[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texas-psm"
version = "0.4.0"
authors = [{ name = "Ronnakrit Rattanasriampaipong", email = "rattanasriampaipong.r@gmail.com" }]
description = "Bayesian GDGT–temperature utilities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.18",
  "xarray>=0.16",
  "netcdf4","h5netcdf",   # xarray netCDF backend; required to read/write posterior .nc files
  "cmdstanpy>=1.0",
  "typing-extensions>=3.7.4",
  "scipy>=1.7",
  "pandas>=1.3",
  "stanio>=0.4",
  "matplotlib>=3.3",
  "psutil"
]

[project.optional-dependencies]
plotting = [
    "ultraplot>=2.4.0",
    "cmocean"          # colormaps used by the SI figure notebooks; TEXAS itself never imports it
]

# Map-figure dependencies (plot_residual_maps). Heavy geo stack (GEOS/PROJ via
# cartopy) kept optional so the core `pip install texas-psm` stays lightweight.
maps = [
    "cartopy>=0.21",
    "regionmask>=0.9",
    "pykrige>=1.7",
    "joblib",          # residual_maps.py parallelizes halo kriging with it;
                       # it used to arrive transitively via scikit-learn
    "shapely"          # residual_maps.py imports shapely.geometry inside the
                       # cartopy guard; it used to arrive only via cartopy
]

dev = [
  "ipykernel",
  "pytest",
  "jupyter-book<2",
  "jupyterlab",
  "ipywidgets",
  "tqdm",
  "pyarrow",        # not imported directly: backs pd.read_parquet
                    # (data/.../PhanTEX_GIG_df.parquet, read by SI_code02)
  "openpyxl",       # not imported directly: backs pd.read_excel of the
                    # culture/mesocosm .xlsx dataset (SI_code00)
  "scikit-learn",   # SI_code00: LinearRegression; SI_code02: LinearRegression
  "seaborn",        # SI_code00/SI_code03 notebook plotting
  "shapely",        # SI_code00/02/03 call shapely.geometry.Point directly
  "baysparpy>=0.0.2",   # SI_code02/03: BAYSPAR TEX86 comparison (notebook-only; not used by TEXAS core)
  "baysplinepy>=0.0.1", # SI_code02/03: BAYSPLINE UK'37 comparison (notebook-only)
  "bayfox",
  "pygplates>=1.0"      # SI_code03: paleo plate reconstruction (pip-installable since 1.0; notebook-only)
]

regrid = [
  "xesmf"
]
# NOTE: esmpy (the ESMF Python bindings xesmf needs at *runtime* for regridding)
# is not published on PyPI — install it from conda-forge:
#   conda install -c conda-forge esmpy
# It is intentionally omitted here so pip/uv can resolve texas-psm and its
# extras. Listing a non-PyPI package in any extra makes `uv lock` fail for the
# whole project, since uv resolves every extra to build its universal lockfile.

all = [
  "texas-psm[plotting]",
  "texas-psm[maps]",
  "texas-psm[dev]",
  "texas-psm[regrid]"
]
[project.scripts]
texas-doctor = "TEXAS.utils.doctor:_cli_main"
texas-install-cmdstan = "TEXAS.utils.install:_cli_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["TEXAS*"]

[tool.setuptools.package-data]
TEXAS = ["stan_models/*.stan", "bundled_posteriors/*.nc", "data/calibration_domain.json"]

[project.urls]
"Homepage" = "https://github.com/PaleoLipidRR/TEXAS"
"Bug Tracker" = "https://github.com/PaleoLipidRR/TEXAS/issues"

[tool.conda-lock.dependencies]
pip = [
    "pygwalker",
    "regionmask"
]

[tool.ruff]
line-length = 100
# `archive` is frozen historical material: superseded models, notebooks and
# figures kept verbatim for the reproducibility record. Linting it would
# demand edits to artifacts whose whole value is being unmodified.
extend-exclude = ["notebooks", "streamlit_app", "docs", "docker", "build", "dist", "archive"]

[tool.ruff.lint]
# pyflakes (F) catches the real issues — undefined names, unused
# imports/variables — without a noisy whole-repo style reformat.
#
# D1 (pydocstyle: missing docstring) is scoped to src/TEXAS by the per-file
# ignores below. The package is the published API and is held to one
# documentation standard; tests and scripts are not, and turning D1 on there
# would add 216 violations that say nothing about the API.
select = ["F", "D1"]

# D100/D104 (module and package headers) would be a separate 23-file sweep and
# are deliberately deferred — see spec §9.6, which scopes the pass to public
# functions, classes and methods. D105/D107 (magic methods, __init__) are
# excluded by that spec directly: an __init__ is documented in its class
# docstring's Args block.
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports (TEXAS.build_fwd_data etc.) are intentional
"tests/**" = ["D1"]        # D1 is for the published API, not the test suite
"scripts/**" = ["D1"]      # nor for the one-off analysis runners
