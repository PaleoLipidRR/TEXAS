[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texas-psm"
version = "0.3.2"
authors = [{ name = "Ronnakrit Rattanasriampaipong", email = "rattanasriampaipong.r@gmail.com" }]
description = "Bayesian GDGT–temperature utilities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.18",
  "xarray>=0.16",
  "netcdf4","h5netcdf",   # xarray netCDF backend; required to read/write posterior .nc files
  "cmdstanpy>=1.0",
  "typing-extensions>=3.7.4",
  "scipy>=1.7",
  "pandas>=1.3",
  "stanio>=0.4",
  "matplotlib>=3.3",
  "cmocean",
  "plotly",
  "psutil"
]

[project.optional-dependencies]
plotting = [
    "ultraplot>=2.4.0"
]

# Map-figure dependencies (plot_residual_maps). Heavy geo stack (GEOS/PROJ via
# cartopy) kept optional so the core `pip install texas-psm` stays lightweight.
maps = [
    "cartopy>=0.21",
    "regionmask>=0.9",
    "pykrige>=1.7"
]

dev = [
  "ipykernel",
  "pytest",
  "jupyter-book<2",
  "jupyterlab",
  "ipywidgets",
  "tqdm",
  "anywidget",
  "ipylab",
  "duckdb",
  "pyarrow",
  "sqlalchemy",
  "pydantic",
  "odrpack>=0.6",   # orthogonal distance regression (odr_fit) used in SI_code1 notebook
  "scikit-learn",   # SI_code1: LinearRegression/RANSAC/Huber/TheilSen, BallTree
  "statsmodels",    # SI_code1 notebook analysis
  "seaborn",        # SI_code1 notebook plotting
  "openpyxl",       # SI_code1: pd.read_excel of the culture/mesocosm .xlsx dataset
  "baysparpy>=0.0.2",   # SI_code2/3: BAYSPAR TEX86 comparison (notebook-only; not used by TEXAS core)
  "baysplinepy>=0.0.1", # SI_code2/3: BAYSPLINE UK'37 comparison (notebook-only)
  "bayfox",
  "pygplates>=1.0"      # SI_code3: paleo plate reconstruction (pip-installable since 1.0; notebook-only)
]

regrid = [
  "geopandas",
  "shapely",
  "cartopy",
  "pyproj<3.6",
  "rtree",
  "pyogrio",
  "mapclassify",
  "geopy",
  "xesmf",
  "gsw>=3.3"
]
# NOTE: esmpy (the ESMF Python bindings xesmf needs at *runtime* for regridding)
# is not published on PyPI — install it from conda-forge:
#   conda install -c conda-forge esmpy
# It is intentionally omitted here so pip/uv can resolve texas-psm and its
# extras. Listing a non-PyPI package in any extra makes `uv lock` fail for the
# whole project, since uv resolves every extra to build its universal lockfile.

all = [
  "texas-psm[plotting]",
  "texas-psm[maps]",
  "texas-psm[dev]",
  "texas-psm[regrid]"
]
[project.scripts]
texas-doctor = "TEXAS.utils.doctor:_cli_main"
texas-install-cmdstan = "TEXAS.utils.install:_cli_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["TEXAS*"]

[tool.setuptools.package-data]
TEXAS = ["stan_models/*.stan", "bundled_posteriors/*.nc", "data/calibration_domain.json"]

[project.urls]
"Homepage" = "https://github.com/PaleoLipidRR/TEXAS"
"Bug Tracker" = "https://github.com/PaleoLipidRR/TEXAS/issues"

[tool.conda-lock.dependencies]
pip = [
    "pygwalker",
    "regionmask",
    "odrpack"
]

# uv-only build override. The `regrid` extra pins `pyproj<3.6` (last conda-friendly
# version), but 3.5.0 ships no cp312 wheel, so on Python 3.12 uv builds it from an
# sdist that needs the PROJ C library and fails. 3.6.1+ has cp312 wheels; this
# override lets uv download a wheel instead. Does not touch the published `regrid`
# constraint (conda still resolves pyproj via conda-forge).
[tool.uv]
override-dependencies = ["pyproj>=3.6.1"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks", "streamlit_app", "docs", "docker", "build", "dist"]

[tool.ruff.lint]
# Start conservative: pyflakes (F) catches the real issues — undefined names,
# unused imports/variables — without a noisy whole-repo style reformat.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports (TEXAS.build_fwd_data etc.) are intentional
