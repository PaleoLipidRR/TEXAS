[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texas-psm"
version = "0.2.1"
authors = [{ name = "Ronnakrit Rattanasriampaipong", email = "rattanasriampaipong.r@gmail.com" }]
description = "Bayesian GDGT–temperature utilities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.18",
  "xarray>=0.16",
  "cmdstanpy>=1.0",
  "typing-extensions>=3.7.4",
  "scipy>=1.7",
  "pandas>=1.3",
  "baysparpy>=0.0.2",
  "baysplinepy>=0.0.1",
  "stanio>=0.4",
  "matplotlib>=3.3",
  "cmocean",
  "plotly",
  "psutil"
]

[project.optional-dependencies]
plotting = [
    "proplot==0.9.7",
    "setuptools<81"
]

# Map-figure dependencies (plot_residual_maps). Heavy geo stack (GEOS/PROJ via
# cartopy) kept optional so the core `pip install texas-psm` stays lightweight.
maps = [
    "cartopy>=0.21",
    "regionmask>=0.9",
    "pykrige>=1.7"
]

dev = [
  "ipykernel",
  "pytest",
  "jupyter-book<2",
  "jupyterlab",
  "ipywidgets",
  "tqdm",
  "anywidget",
  "ipylab",
  "duckdb",
  "pyarrow",
  "sqlalchemy",
  "pydantic"
]

regrid = [
  "geopandas",
  "shapely",
  "cartopy",
  "pyproj<3.6",
  "rtree",
  "pyogrio",
  "mapclassify",
  "geopy",
  "xesmf",
  "esmpy",
  "gsw>=3.3"
]

all = [
  "texas-psm[plotting]",
  "texas-psm[dev]",
  "texas-psm[regrid]"
]
[tool.setuptools.packages.find]
where = ["src"]
include = ["TEXAS*"]

[tool.setuptools.package-data]
TEXAS = ["stan_models/*.stan"]

[project.urls]
"Homepage" = "https://github.com/PaleoLipidRR/TEXAS"
"Bug Tracker" = "https://github.com/PaleoLipidRR/TEXAS/issues"

[tool.conda-lock.dependencies]
pip = [
    "pygwalker",
    "regionmask",
    "odrpack"
]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks", "streamlit_app", "docs", "docker", "build", "dist"]

[tool.ruff.lint]
# Start conservative: pyflakes (F) catches the real issues — undefined names,
# unused imports/variables — without a noisy whole-repo style reformat.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports (TEXAS.build_fwd_data etc.) are intentional
