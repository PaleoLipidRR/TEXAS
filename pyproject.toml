[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texas-psm"
version = "0.1.2"
authors = [{ name = "Ronnakrit Rattanasriampaipong", email = "rattanasriampaipong.r@gmail.com" }]
description = "Bayesian GDGT–temperature utilities"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.18",
  "xarray>=0.16",
  "cmdstanpy>=1.0",
  "typing-extensions>=3.7.4",
  "scipy>=1.7",
  "pandas>=1.3",
  "baysparpy>=0.0.2",
  "baysplinepy>=0.0.1",
  "stanio>=0.4"
]

[project.optional-dependencies]
plotting = [
    "matplotlib>=3.5",
    "proplot==0.9.7",
    "cmocean",
    "setuptools<81",
    "plotly"
]

dev = [
  "ipykernel",
  "pytest",
  "mkdocs",
  "jupyterlab",
  "ipywidgets",
  "tqdm",
  "anywidget",
  "ipylab",
  "duckdb",
  "pyarrow",
  "sqlalchemy",
  "pydantic"
]

regrid = [
  "geopandas",
  "shapely",
  "cartopy",
  "pyproj<3.6",
  "rtree",
  "pyogrio",
  "mapclassify",
  "geopy",
  "xesmf",
  "esmpy",
  "gsw>=3.3"
]

all = [
  "texas-psm[plotting]",
  "texas-psm[dev]",
  "texas-psm[regrid]"
]
[tool.setuptools.packages.find]
where = ["src"]
include = ["TEXAS*"]

[tool.setuptools.package-data]
TEXAS = ["stan_models/*.stan"]

[project.urls]
"Homepage" = "https://github.com/PaleoLipidRR/TEXAS"
"Bug Tracker" = "https://github.com/PaleoLipidRR/TEXAS/issues"

[tool.conda-lock.dependencies]
pip = [
    "pygwalker"
]
