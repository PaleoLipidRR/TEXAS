[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TEXAS"
version = "0.1.0"
authors = [
    {name = "Ronnakrit Rattanasriampaipong", email = "rattanasriampaipong.r@gmail.com"}
]
description = "Bayesian GDGT–temperature utilities"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# These are the Python packages your code IMPORTS.
# Non-Python dependencies like TBB and CmdStan must be installed separately.
dependencies = [
    "numpy>=1.18",
    "xarray>=0.16",
    "cmdstanpy>=1.0",
    "typing-extensions>=3.7.4",
    "scipy>=1.7",
    "pandas",
]

[project.optional-dependencies]
plotting = [
    "matplotlib",
    "proplot",
]
dev = [
    "ipykernel",
    "pytest",
    "mkdocs",
]

[tool.setuptools]
# This tells setuptools to find the TEXAS package automatically.
# Make sure your main code is in a directory named TEXAS.
packages = ["TEXAS"]

[tool.setuptools.package-data]
# This is perfect! It ensures your .stan files are included in the installation.
TEXAS = ["stan_models/*.stan"]

[project.urls]
"Homepage" = "https://github.com/PaleoLipidRR/TEXAS"
"Bug Tracker" = "https://github.com/PaleoLipidRR/TEXAS/issues"